name: TEMP Atlas decision-flow release regeneration
on:
  push:
    branches:
      - feature/lab-three-guided-comparison-flows-20261016
    paths:
      - "rta-lab/atlas-preview/**"
      - "tools/check-rta-decision-flows.js"
      - ".github/workflows/atlas-decision-build-temp.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate deterministic preview cache and deployed release
        run: |
          node tools/build-rta-atlas-cache.js
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-cache.js --check
          node tools/build-rta-atlas-release.js --check
          node tools/check-rta-decision-flows.js
      - name: Commit deterministic generated assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas/
          if ! git diff --cached --quiet; then
            git commit -m "build(atlas): regenerate release and isolated cache for guided Lab flows"
            git push origin HEAD:feature/lab-three-guided-comparison-flows-20261016
          fi
