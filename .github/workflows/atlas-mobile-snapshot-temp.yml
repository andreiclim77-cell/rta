name: TEMP RTA Atlas Mobile Build
on:
  push:
    branches:
      - feature/atlas-mobile-fit-visible-comparisons-20261016
    paths:
      - "rta-lab/atlas-preview/**"
      - ".github/workflows/atlas-mobile-snapshot-temp.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic rebuild and model QA
        run: |
          node --check rta-lab/atlas-preview/decision-explorer.js
          node tools/build-rta-atlas-cache.js
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-cache.js --check
          node tools/build-rta-atlas-release.js --check
          node tools/check-rta-decision-flows.js
          node tools/check-rta-atlas-preview.js
      - name: Commit source-synchronized preview and release assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas/
          if ! git diff --cached --quiet; then
            git commit -m "build(atlas): synchronize mobile-fit release and caches"
            git push origin HEAD:feature/atlas-mobile-fit-visible-comparisons-20261016
          fi
