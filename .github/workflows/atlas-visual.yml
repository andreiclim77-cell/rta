name: RTA Atlas V02 Visual Mobile Gate
on:
  pull_request:
    paths:
      - "rta-lab/atlas-preview/**"
      - "rta-lab/atlas/**"
      - "rta-lab/sw.js"
      - "rta-lab/refresh.html"
      - "sw.js"
      - "tools/build-rta-atlas-release.js"
      - "tools/build-rta-atlas-cache.js"
      - "tools/check-rta-atlas-visual.js"
      - "tools/check-rta-atlas-modules-visual.js"
      - "tools/check-rta-atlas-offline.js"
      - ".github/workflows/atlas-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless browser driver
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          which google-chrome || which google-chrome-stable
      - name: Verify real mobile layout, photography, and interaction motion
        run: |
          node tools/check-rta-atlas-visual.js
          node tools/check-rta-atlas-modules-visual.js
          node tools/check-rta-atlas-offline.js
          RTA_ATLAS_ROUTE=atlas node tools/check-rta-atlas-offline.js
      - name: Save mobile screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v02-mobile-screenshots
          path: artifacts/atlas-v02-mobile/
          if-no-files-found: warn
          retention-days: 14
