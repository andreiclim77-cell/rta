name: Cloudflare Smokee Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/smokee-sync-backup/worker.mjs"
      - "cloudflare/smokee-sync-backup/worker-hype.mjs"
      - "cloudflare/smokee-sync-backup/wrangler.toml"
      - ".github/workflows/cloudflare-smokee-worker-deploy.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Worker source
        run: |
          node --check cloudflare/smokee-sync-backup/worker.mjs
          node --check cloudflare/smokee-sync-backup/worker-hype.mjs

      - name: Deploy existing Worker with Hype refresh bridge
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: cloudflare/smokee-sync-backup
        run: npx --yes wrangler@4 deploy

      - name: Report unavailable deploy credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare deploy credentials are not configured in GitHub Actions; source validation passed but deployment was skipped."
