name: Facebook RTA editorial series

on:
  workflow_dispatch:
  schedule:
    # 06:05 in Romania: EEST (UTC+3) and EET (UTC+2). The gate below selects the correct trigger.
    - cron: "5 3 * * *"
    - cron: "5 4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook-rta-editorial-series
  cancel-in-progress: false

jobs:
  publish:
    if: vars.FACEBOOK_AUTOPUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from the latest publication state
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Gate scheduled trigger to 06:05 Bucharest
        id: schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bucharest_offset="$(TZ=Europe/Bucharest date +%z)"
          scheduled_cron="${{ github.event.schedule }}"
          if { [ "$bucharest_offset" = "+0300" ] && [ "$scheduled_cron" = "5 3 * * *" ]; } ||
             { [ "$bucharest_offset" = "+0200" ] && [ "$scheduled_cron" = "5 4 * * *" ]; }; then
            echo "run_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping seasonal cron $scheduled_cron for Bucharest offset $bucharest_offset."
          fi

      - name: Set up Node.js
        if: steps.schedule_gate.outputs.run_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image processor
        if: steps.schedule_gate.outputs.run_publish == 'true'
        run: npm ci

      - name: Validate editorial publisher
        if: steps.schedule_gate.outputs.run_publish == 'true'
        run: |
          node --check tools/facebook-publisher.js
          node tools/check-facebook-publisher.js
          node tools/facebook-publisher.js --check-editorial --max-posts 2

      - name: Detect remaining editorial posts
        if: steps.schedule_gate.outputs.run_publish == 'true'
        id: pending
        shell: bash
        run: |
          echo "count=$(node tools/facebook-publisher.js --editorial-pending-count --max-posts 2)" >> "$GITHUB_OUTPUT"

      - name: Check Meta connection without changing publication state
        if: steps.schedule_gate.outputs.run_publish == 'true' && steps.pending.outputs.count != '0'
        id: meta
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/meta-token-gate.js

      - name: Publish one verified atomizer and one verified mod
        if: steps.schedule_gate.outputs.run_publish == 'true' && steps.pending.outputs.count != '0' && steps.meta.outputs.ready == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/facebook-publisher.js --publish-editorial --max-posts 2

      - name: Commit editorial state
        if: steps.schedule_gate.outputs.run_publish == 'true' && steps.pending.outputs.count != '0' && steps.meta.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/facebook-campaign-state.json; then
            echo "No editorial state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facebook-campaign-state.json
          git commit -m "Record Facebook editorial post"
          git pull --rebase
          git push

      - name: Report completed daily pair
        if: steps.schedule_gate.outputs.run_publish == 'true' && steps.pending.outputs.count == '0'
        run: echo "The Romanian daily pair is already complete, or no verified product image is currently available."
