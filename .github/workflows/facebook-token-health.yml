name: Facebook token health

on:
  workflow_dispatch:
  schedule:
    # One daily check is enough; scheduled publishers also use the same safe gate.
    - cron: "40 3 * * *"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Determine weekly permission check
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Bucharest date +%u)" = "7" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Meta connection without changing publication state
        id: meta
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/meta-token-gate.js

      - name: Verify Facebook Page identity
        if: steps.meta.outputs.ready == 'true'
        id: credentials
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/facebook-publisher.js --verify-credentials

      - name: Verify publish permission weekly
        if: steps.meta.outputs.ready == 'true' && steps.cadence.outputs.weekly == 'true'
        id: capability
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/facebook-publisher.js --verify-publish-capability

      - name: Open or update Facebook token alert
        if: steps.meta.outputs.ready != 'true' || steps.credentials.outcome == 'failure' || steps.capability.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Automatizare] Tokenul Facebook necesita verificare';
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = data.find(issue => issue.title === title);
            const reason = '${{ steps.meta.outputs.reason }}' || 'permission_check_failed';
            const body = `Publicarea sociala este oprita in siguranta (${reason}). Catalogul continua sa se sincronizeze. Consultati rularea GitHub Actions ${context.runId}; tokenurile nu sunt incluse in jurnal.`;
            if (!existing) await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Close resolved Facebook token alert
        if: steps.meta.outputs.ready == 'true' && steps.credentials.outcome != 'failure' && steps.capability.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Automatizare] Tokenul Facebook necesita verificare';
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const issue of data.filter(item => item.title === title)) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }
