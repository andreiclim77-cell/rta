name: Market 2026 Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/market-2026.js"
      - "assets/market-2026-report.js"
      - "assets/market-coverage-ui.js"
      - "assets/market-sales-ui.js"
      - "assets/market-loading-guard.js"
      - "assets/market-management-v2.js"
      - "assets/market-executive-report-v2.js"
      - "assets/market-demand-ui.js"
      - "assets/market-hype-ui.js"
      - "assets/market-hype-ui.css"
      - "assets/market-view-switcher.js"
      - "assets/market-view-switcher.css"
      - "assets/enhancements.js"
      - "assets/enhancements-core.js"
      - "data/market-2026.json"
      - "data/market-coverage-2026.json"
      - "data/market-sales-2026.json"
      - "data/market-demand-intelligence-2026.json"
      - "data/market-product-presence-2026.json"
      - "data/market-hype-radar-2026.json"
      - "data/market-hype-sources-2026.json"
      - "data/market-retailers-2026.json"
      - "tools/market-product-canonical-2026.js"
      - "tools/canonicalize-market-sales-products-2026.js"
      - "tools/canonicalize-market-demand-products-2026.js"
      - "tools/build-market-product-presence-2026.js"
      - "tools/augment-market-management-presence-2026.js"
      - "tools/collect-market-hype-radar-2026.js"
      - "tools/sync-market-2026.js"
      - "tools/sync-market-smokee-2026.js"
      - "tools/sync-market-specialized-2026.js"
      - "tools/verify-market-prices-2026.js"
      - "tools/normalize-market-2026.js"
      - "tools/market-coverage-audit-2026.js"
      - "tools/validate-market-daily-2026.js"
      - "tools/sync-market-sales-2026.js"
      - "tools/build-market-sales-summary-2026.js"
      - "tools/collect-market-demand-intelligence-2026.js"
      - "tools/build-market-management-2026.js"
      - ".github/workflows/market-2026-sync.yml"
      - ".github/workflows/market-sales-2026-sync.yml"
      - ".github/workflows/market-hype-2026-sync.yml"
      - "sw.js"
      - ".github/workflows/market-2026-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current Market architecture
        run: |
          for f in assets/enhancements.js assets/enhancements-core.js assets/market-2026.js assets/market-2026-report.js assets/market-coverage-ui.js assets/market-sales-ui.js assets/market-loading-guard.js assets/market-management-v2.js assets/market-executive-report-v2.js assets/market-demand-ui.js assets/market-hype-ui.js assets/market-view-switcher.js tools/market-product-canonical-2026.js tools/canonicalize-market-sales-products-2026.js tools/canonicalize-market-demand-products-2026.js tools/build-market-product-presence-2026.js tools/augment-market-management-presence-2026.js tools/collect-market-hype-radar-2026.js tools/sync-market-2026.js tools/sync-market-smokee-2026.js tools/sync-market-specialized-2026.js tools/verify-market-prices-2026.js tools/normalize-market-2026.js tools/market-coverage-audit-2026.js tools/validate-market-daily-2026.js tools/sync-market-sales-2026.js tools/build-market-sales-summary-2026.js tools/collect-market-demand-intelligence-2026.js tools/build-market-management-2026.js sw.js; do node --check "$f"; done
          node tools/normalize-market-2026.js --check
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/market-2026.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('data/market-retailers-2026.json','utf8'));
          const sales=JSON.parse(fs.readFileSync('data/market-sales-2026.json','utf8'));
          const demand=JSON.parse(fs.readFileSync('data/market-demand-intelligence-2026.json','utf8'));
          const presence=JSON.parse(fs.readFileSync('data/market-product-presence-2026.json','utf8'));
          const hype=JSON.parse(fs.readFileSync('data/market-hype-radar-2026.json','utf8'));
          const market=fs.readFileSync('assets/market-2026.js','utf8');
          const loader=fs.readFileSync('assets/enhancements.js','utf8');
          const guard=fs.readFileSync('assets/market-loading-guard.js','utf8');
          const switcher=fs.readFileSync('assets/market-view-switcher.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const daily=fs.readFileSync('.github/workflows/market-2026-sync.yml','utf8');
          const salesFlow=fs.readFileSync('.github/workflows/market-sales-2026-sync.yml','utf8');
          const hypeFlow=fs.readFileSync('.github/workflows/market-hype-2026-sync.yml','utf8');
          const validator=fs.readFileSync('tools/validate-market-daily-2026.js','utf8');
          const expectedHash='113180da7cf6dcdea360d1d14de73ebb5c245ae582224c906012b9bf9395e615';
          if([data,registry,sales,demand,presence,hype].some(x=>Number(x.scopeYear)!==2026))throw new Error('Market scope must remain 2026');
          if((registry.retailers||[]).length<22)throw new Error('National registry shrank below 22 validated storefronts');
          if(!(data.observations||[]).length)throw new Error('Market dataset has no observations');
          if(!market.includes(expectedHash)||!market.includes('trendSnapshots'))throw new Error('Market core/access/trend regression');
          if(!daily.includes("cron: '0 3 * * *'")||!daily.includes("cron: '0 4 * * *'")||!validator.includes('status.date!==today'))throw new Error('06:00/freshness architecture missing');
          for(const token of ['canonicalize-market-sales-products-2026.js','canonicalize-market-demand-products-2026.js','build-market-product-presence-2026.js','augment-market-management-presence-2026.js'])if(!salesFlow.includes(token))throw new Error('Canonical market pipeline missing '+token);
          if(!hypeFlow.includes("cron: '0 3 * * *'")||!hypeFlow.includes("cron: '0 4 * * *'")||!hypeFlow.includes('collect-market-hype-radar-2026.js'))throw new Error('Daily Hype Radar workflow missing');
          for(const asset of ['/assets/market-loading-guard.js?v=5','/assets/market-management-v2.js?v=1','/assets/market-executive-report-v2.js?v=1','/assets/market-hype-ui.js?v=1','/assets/market-view-switcher.js?v=2'])if(!loader.includes(asset)||!sw.includes(asset))throw new Error('Loader/cache mismatch '+asset);
          if(!switcher.includes("data-primary=\"analysis\"")||!switcher.includes('Details')||!switcher.includes('marketHypeRadar'))throw new Error('Analysis/Details/Hype primary UI missing');
          if(!guard.includes('/data/market-product-presence-2026.json')||!guard.includes('/data/market-hype-radar-2026.json')||!guard.includes('marketHypeRadar'))throw new Error('Atomic loading guard incomplete');
          if(!sw.includes("url.pathname.startsWith('/assets/market-')")||!sw.includes("'/data/market-hype-radar-2026.json'"))throw new Error('Market/Hype assets are not network-first');
          if(!presence.methodology||!/Bestseller breadth/i.test(String(presence.methodology.truthRule||'')))throw new Error('Listing/bestseller truth rule missing');
          if(!sales.methodology||sales.methodology.noStockInference!==true)throw new Error('Sales layer must prohibit stock-based sales inference');
          if(sales.coverage&&sales.coverage.nationalMarketShareAvailable===true&&Number(sales.coverage.storefrontsWithActualUnitSales)!==(registry.retailers||[]).length)throw new Error('National market share claimed without full Tier-A coverage');
          if(hype.mode!=='pre-market-upstream-only'||!hype.truth||hype.truth.retailSourcesUsed!==false||hype.truth.commercialPagesRejected!==true)throw new Error('Hype upstream-only truth rule missing');
          for(const rows of Object.values(hype.categories||{}))for(const x of rows||[])if(x.brand||x.url||x.price||x.shop||x.retailerId)throw new Error('Hype public output leaks brand/shop/price');
          console.log(`Market structural gate OK: ${(data.observations||[]).length} observations; ${(registry.retailers||[]).length} storefronts; Analysis/Details + Hype ready; refresh 06:00 Bucharest.`);
          NODE
