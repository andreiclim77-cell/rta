name: Market 2026 Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "assets/market-*.js"
      - "assets/market-*.css"
      - "assets/enhancements.js"
      - "assets/enhancements-core.js"
      - "data/market-*.json"
      - "tools/*market*2026.js"
      - "tools/audit-evidence-integrity.js"
      - "tools/evidence-observation-date.js"
      - "tools/test-evidence-integrity.js"
      - ".github/workflows/market-2026-sync.yml"
      - ".github/workflows/market-sales-2026-sync.yml"
      - ".github/workflows/market-hype-2026-sync.yml"
      - ".github/workflows/market-hype-worker-deploy.yml"
      - "cloudflare/market-hype-refresh/worker.mjs"
      - "sw.js"
      - ".github/workflows/market-2026-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          for f in \
            assets/enhancements.js \
            assets/enhancements-core.js \
            assets/market-2026.js \
            assets/market-loading-guard.js \
            assets/market-ui-recovery.js \
            assets/market-management-v2.js \
            assets/market-analysis-synthesis.js \
            assets/market-hype-ui.js \
            assets/market-view-switcher.js \
            assets/market-source-info.js \
            tools/check-market-report-final.js \
            tools/collect-market-hype-radar-2026.js \
            tools/collect-market-hype-deep-2026.js \
            tools/filter-market-hype-evidence-2026.js \
            tools/collect-market-hype-wide-2026.js \
            tools/collect-market-hype-products-2026.js \
            tools/collect-market-hype-vendor-profiles-v2-2026.js \
            tools/augment-market-hype-preorder-card-events-2026.js \
            tools/enforce-market-hype-symmetric-window-2026.js \
            tools/merge-market-hype-upstream-products-2026.js \
            tools/collect-market-hype-pods-2026.js \
            tools/market-pod-classifier-2026.js \
            tools/observe-market-hype-retail-first-seen-2026.js \
            tools/collect-market-hype-direct-catalogs-2026.js \
            tools/collect-market-hype-dated-news-2026.js \
            tools/collect-market-hype-retail-campaigns-2026.js \
            tools/backfill-market-hype-product-evidence-2026.js \
            tools/consolidate-market-hype-2026.js \
            tools/reconcile-market-hype-public-2026.js \
            tools/market-hype-verification-identity-2026.js \
            tools/test-market-hype-public-reconcile-2026.js \
            tools/validate-market-hype-pods-2026.js \
            tools/check-market-data-quality-2026.js \
            tools/probe-market-sales-counters-2026.js \
            tools/market-product-canonical-2026.js \
            tools/canonicalize-market-sales-products-2026.js \
            tools/canonicalize-market-demand-products-2026.js \
            tools/build-market-product-presence-2026.js \
            tools/augment-market-management-presence-2026.js \
            tools/sync-market-2026.js \
            tools/sync-market-smokee-2026.js \
            tools/sync-market-specialized-2026.js \
            tools/verify-market-prices-2026.js \
            tools/normalize-market-2026.js \
            tools/market-coverage-audit-2026.js \
            tools/validate-market-daily-2026.js \
            tools/sync-market-sales-2026.js \
            tools/build-market-sales-summary-2026.js \
            tools/collect-market-demand-intelligence-2026.js \
            tools/build-market-management-2026.js \
            tools/build-market-public-analysis-2026.js \
            tools/test-market-public-analysis-2026.js \
            tools/test-market-direct-catalogs-2026.js \
            tools/audit-evidence-integrity.js \
            tools/evidence-observation-date.js \
            tools/test-evidence-integrity.js \
            cloudflare/market-hype-refresh/worker.mjs \
            sw.js; do node --check "$f"; done
          node tools/normalize-market-2026.js --check

      - name: Validate Market and Hype contracts
        run: |
          node tools/test-market-public-analysis-2026.js
          node tools/test-market-direct-catalogs-2026.js
          node tools/test-evidence-integrity.js
          node tools/audit-evidence-integrity.js --scope=all
          node tools/check-market-report-final.js
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const json=p=>JSON.parse(read(p));
          const market=json('data/market-2026.json');
          const registry=json('data/market-retailers-2026.json');
          const sales=json('data/market-sales-2026.json');
          const demand=json('data/market-demand-intelligence-2026.json');
          const presence=json('data/market-product-presence-2026.json');
          const cfg=json('data/market-hype-sources-2026.json');
          const loader=read('assets/enhancements.js');
          const guard=read('assets/market-loading-guard.js');
          const recovery=read('assets/market-ui-recovery.js');
          const analysis=read('assets/market-management-v2.js');
          const synth=read('assets/market-analysis-synthesis.js');
          const hypeUi=read('assets/market-hype-ui.js');
          const switcher=read('assets/market-view-switcher.js');
          const sourceInfo=read('assets/market-source-info.js');
          const productHype=read('tools/collect-market-hype-products-2026.js');
          const upstreamMerge=read('tools/merge-market-hype-upstream-products-2026.js');
          const preorder=read('tools/augment-market-hype-preorder-card-events-2026.js');
          const symmetric=read('tools/enforce-market-hype-symmetric-window-2026.js');
          const probe=read('tools/probe-market-sales-counters-2026.js');
          const sw=read('sw.js');
          const daily=read('.github/workflows/market-2026-sync.yml');
          const salesFlow=read('.github/workflows/market-sales-2026-sync.yml');
          const hypeFlow=read('.github/workflows/market-hype-2026-sync.yml');
          const validator=read('tools/validate-market-daily-2026.js');
          const worker=read('cloudflare/market-hype-refresh/worker.mjs');
          const marketJs=read('assets/market-2026.js');
          if([market,registry,sales,demand,presence,cfg].some(x=>Number(x.scopeYear)!==2026))throw new Error('Market scope must remain 2026');
          if((registry.retailers||[]).length<22)throw new Error('National registry shrank below 22 storefronts');
          if(!(market.observations||[]).length)throw new Error('Market dataset has no observations');
          if(!marketJs.includes("PASSWORD_SHA256='113180da7cf6dcdea360d1d14de73ebb5c245ae582224c906012b9bf9395e615'")||!marketJs.includes('market2026Password')||!marketJs.includes('requestAccess')||!marketJs.includes('renderLocked')||!marketJs.includes('clearAccess();')||!marketJs.includes('trendSnapshots'))throw new Error('Piața RTA password/trend regression');
          if(!daily.includes("cron: '0 3 * * *'")||!daily.includes("cron: '0 4 * * *'")||!daily.includes("cron: '0 5 * * *'"))throw new Error('Market 06:00 + 07:00 fallback architecture missing');
          if(!hypeFlow.includes("cron: '0,20 3 * * *'")||!hypeFlow.includes("cron: '0,20 4 * * *'")||!hypeFlow.includes('06:20'))throw new Error('Hype 06:00 + 06:20 recovery architecture missing');
          if(!salesFlow.includes('workflow_run:')||!salesFlow.includes('Market 2026 Daily Sync')||!salesFlow.includes("cron: '30 4 * * *'")||!salesFlow.includes("cron: '30 5 * * *'"))throw new Error('Analysis chained + 07:30 fallback architecture missing');
          if(!validator.includes('status.date!==today'))throw new Error('Daily freshness validator missing');
          for(const token of ['canonicalize-market-sales-products-2026.js','canonicalize-market-demand-products-2026.js','build-market-product-presence-2026.js','augment-market-management-presence-2026.js','probe-market-sales-counters-2026.js'])if(!salesFlow.includes(token))throw new Error('Sales/management pipeline missing '+token);
          for(const token of ['collect-market-hype-radar-2026.js','collect-market-hype-deep-2026.js','filter-market-hype-evidence-2026.js','collect-market-hype-wide-2026.js','collect-market-hype-products-2026.js','collect-market-hype-vendor-profiles-v2-2026.js','augment-market-hype-preorder-card-events-2026.js','enforce-market-hype-symmetric-window-2026.js','collect-market-hype-pods-2026.js','observe-market-hype-retail-first-seen-2026.js','collect-market-hype-direct-catalogs-2026.js','collect-market-hype-dated-news-2026.js','collect-market-hype-retail-campaigns-2026.js','backfill-market-hype-product-evidence-2026.js','consolidate-market-hype-2026.js','reconcile-market-hype-public-2026.js'])if(!hypeFlow.includes(token))throw new Error('Hype daily pipeline missing '+token);
          if(!preorder.includes('preorderCardEtaRecovery:true')||!symmetric.includes('symmetric30DayEventWindow:true')||!symmetric.includes('signalObservationWindowDays:30'))throw new Error('Launch-window / signal-window Hype contract missing');
          const essential=['/assets/market-2026.js?v=7','/assets/market-loading-guard.js?v=22','/assets/market-ui-recovery.js?v=15','/assets/market-management-v2.js?v=10','/assets/market-analysis-synthesis.js?v=7','/assets/market-analysis-truth.css?v=1','/assets/market-hype-ui.js?v=14','/assets/market-view-switcher.js?v=11'];
          for(const asset of essential)if(!loader.includes(asset)||!sw.includes(asset))throw new Error('Loader/cache mismatch '+asset);
          if(!sw.includes('/assets/enhancements.css?v=9')||!sw.includes('/assets/enhancements.js?v=11')||!sw.includes('/assets/market-source-info.js?v=5')||!sw.includes('/assets/market-hype-ui.css?v=11')||!sw.includes('ghid-rta-static-v50-clean-market-ui'))throw new Error('Final Market/Hype cache manifest mismatch');
          if(!sw.includes('/data/market-hype-products-2026.json')||!sw.includes('/data/market-hype-pods-2026.json'))throw new Error('Concrete Hype data are not network-first');
          if(!guard.includes("key:'hypeProducts'")||!guard.includes("key:'hypePods'")||!guard.includes('catalog-published-at')||!guard.includes('validAfterProduct')||!guard.includes('signalWindowOnly')||!recovery.includes('market-hype-ui.js?v=14'))throw new Error('Atomic/recovery Hype contract incomplete');
          if(!analysis.includes('Analiza pieței RTA')||!analysis.includes('ROMÂNIA · ACTUALIZARE ZILNICĂ')||!analysis.includes('Clasamente simple pe mărci și produse'))throw new Error('Clean Analysis heading missing');
          for(const token of ['/data/market-analysis-public-2026.json','Vizibilitate în magazine','Topuri publice, nu volume de vânzări.','Idei de cumpărare','categoryGrid','interestDetail','data-synth-view="brands"','data-synth-view="products"'])if(!synth.includes(token)&&!analysis.includes(token))throw new Error('Focused Analysis synthesis missing '+token);
          for(const rejected of ['01.01.2025','nu este disponibilă','nu s-au colectat','Tier A','Sinteză prudentă','INTERVAL SOLICITAT','DATE VERIFICABILE DISPONIBILE','Perioada cu dovezi','clasamentele cumulative'])if(synth.includes(rejected)||analysis.includes(rejected))throw new Error('Technical or stale Analysis text returned: '+rejected);
          if(!switcher.includes('ROMÂNIA · ACTUALIZARE ZILNICĂ')||!switcher.includes('Lansări · radar · disponibilitate'))throw new Error('Final navigation copy missing');
          if(sales.analysisStart!=='2026-01-01'||!sales.analysisWindow||sales.analysisWindow.historicalBackfillInvented!==false)throw new Error('Sales evidence window contract missing');
          if(!sourceInfo.includes('market-hype-heartbeat-evidence-2026.json')||!sourceInfo.includes('GLOBAL pentru RTA + clone RTA'))throw new Error('Info surse Hype evidence missing');
          if(Number(cfg.hypeWindowDays)!==30||Number(cfg.lookbackHours)!==720||cfg.scope!=='GLOBAL RTA + clone RTA')throw new Error('Global 30-day Hype config missing');
          if((cfg.officialMakers||[]).length<35||(cfg.cloneMakers||[]).length<12||(cfg.forumDomains||[]).length<14)throw new Error('Global Hype source coverage too small');
          for(const token of ['2fdeal.com','3fvape.com','facebook.com','instagram.com','youtube.com','ecigssa.co.za','vapoo.de','SXK','ULTON','YFTK','SJMY','Tobeco'])if(!JSON.stringify(cfg).toLowerCase().includes(token.toLowerCase()))throw new Error('Global Hype source/maker missing '+token);
          for(const token of ['productLevelOnly:true','newArrivalIsNotRelease:true','relistingIsNotRelease:true','BANNED_HOSTS'])if(!productHype.includes(token))throw new Error('Product Hype protection missing '+token);
          for(const token of ['upstreamEvidenceMerged:true','release-observed','observedReleaseIsNotClaimedAsExactReleaseDate:true'])if(!upstreamMerge.includes(token))throw new Error('Upstream Hype merge protection missing '+token);
          if(!hypeUi.includes('hype-category-button')||!hypeUi.includes('hype-product-card')||hypeUi.includes('class="hype-direct"')||!hypeUi.includes('data-hype-layer="launches"')||!hypeUi.includes('data-hype-layer="signals"')||!hypeUi.includes('data-hype-layer="catalog"')||!hypeUi.includes('Ce urmează și ce e nou'))throw new Error('Product-level clean Hype UI regression');
          for(const rejected of ['Cum a fost verificat','SURSE VERIFICATE LA ULTIMA ACTUALIZARE','module finalizate','memorie anti-relistare','De ce este aici','Data dovezii'])if(hypeUi.includes(rejected))throw new Error('Technical Hype copy returned: '+rejected);
          if(!probe.includes('rejectedGenericOrderCounters:true')||!probe.includes('validHistoricCounter'))throw new Error('Generic order-counter rejection missing');
          if(!sales.methodology||sales.methodology.noStockInference!==true)throw new Error('Sales layer must prohibit stock-based sales inference');
          if(!presence.methodology||!/Bestseller breadth/i.test(String(presence.methodology.truthRule||'')))throw new Error('Listing/bestseller separation missing');
          if(!worker.includes('progressForRun')||!worker.includes('/actions/runs/')||!worker.includes("kind:'hype-refresh'"))throw new Error('Hype refresh progress source missing');
          console.log(`Market gate OK: ${(market.observations||[]).length} observations; ${(registry.retailers||[]).length} storefronts; password-protected clean Analysis/Hype; 06:00 primary + recovery.`);
          NODE
