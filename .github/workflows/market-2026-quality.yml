name: Market 2026 Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "assets/market-2026.js"
      - "assets/market-2026-report.js"
      - "assets/market-coverage-ui.js"
      - "assets/market-sales-ui.js"
      - "assets/market-loading-guard.js"
      - "assets/market-ui-recovery.js"
      - "assets/market-management-v2.js"
      - "assets/market-executive-report-v2.js"
      - "assets/market-demand-ui.js"
      - "assets/market-hype-ui.js"
      - "assets/market-hype-ui.css"
      - "assets/market-management-augment.js"
      - "assets/market-view-switcher.js"
      - "assets/market-view-switcher.css"
      - "assets/enhancements.js"
      - "assets/enhancements-core.js"
      - "data/market-2026.json"
      - "data/market-coverage-2026.json"
      - "data/market-sales-2026.json"
      - "data/market-demand-intelligence-2026.json"
      - "data/market-product-presence-2026.json"
      - "data/market-hype-sources-2026.json"
      - "data/market-hype-radar-2026.json"
      - "data/market-retailers-2026.json"
      - "tools/market-product-canonical-2026.js"
      - "tools/canonicalize-market-sales-products-2026.js"
      - "tools/canonicalize-market-demand-products-2026.js"
      - "tools/build-market-product-presence-2026.js"
      - "tools/augment-market-management-presence-2026.js"
      - "tools/collect-market-hype-radar-2026.js"
      - "tools/sync-market-2026.js"
      - "tools/sync-market-smokee-2026.js"
      - "tools/sync-market-specialized-2026.js"
      - "tools/verify-market-prices-2026.js"
      - "tools/normalize-market-2026.js"
      - "tools/market-coverage-audit-2026.js"
      - "tools/validate-market-daily-2026.js"
      - "tools/sync-market-sales-2026.js"
      - "tools/build-market-sales-summary-2026.js"
      - "tools/collect-market-demand-intelligence-2026.js"
      - "tools/build-market-management-2026.js"
      - "cloudflare/market-hype-refresh/worker.mjs"
      - ".github/workflows/market-2026-sync.yml"
      - ".github/workflows/market-sales-2026-sync.yml"
      - ".github/workflows/market-hype-2026-sync.yml"
      - ".github/workflows/market-hype-worker-deploy.yml"
      - "sw.js"
      - ".github/workflows/market-2026-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current Market architecture
        run: |
          for f in assets/enhancements.js assets/enhancements-core.js assets/market-2026.js assets/market-2026-report.js assets/market-coverage-ui.js assets/market-sales-ui.js assets/market-loading-guard.js assets/market-ui-recovery.js assets/market-management-v2.js assets/market-executive-report-v2.js assets/market-demand-ui.js assets/market-hype-ui.js assets/market-management-augment.js assets/market-view-switcher.js tools/market-product-canonical-2026.js tools/canonicalize-market-sales-products-2026.js tools/canonicalize-market-demand-products-2026.js tools/build-market-product-presence-2026.js tools/augment-market-management-presence-2026.js tools/collect-market-hype-radar-2026.js tools/sync-market-2026.js tools/sync-market-smokee-2026.js tools/sync-market-specialized-2026.js tools/verify-market-prices-2026.js tools/normalize-market-2026.js tools/market-coverage-audit-2026.js tools/validate-market-daily-2026.js tools/sync-market-sales-2026.js tools/build-market-sales-summary-2026.js tools/collect-market-demand-intelligence-2026.js tools/build-market-management-2026.js cloudflare/market-hype-refresh/worker.mjs sw.js; do node --check "$f"; done
          node tools/normalize-market-2026.js --check
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/market-2026.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('data/market-retailers-2026.json','utf8'));
          const sales=JSON.parse(fs.readFileSync('data/market-sales-2026.json','utf8'));
          const demand=JSON.parse(fs.readFileSync('data/market-demand-intelligence-2026.json','utf8'));
          const presence=JSON.parse(fs.readFileSync('data/market-product-presence-2026.json','utf8'));
          const hype=JSON.parse(fs.readFileSync('data/market-hype-radar-2026.json','utf8'));
          const hypeCfg=JSON.parse(fs.readFileSync('data/market-hype-sources-2026.json','utf8'));
          const market=fs.readFileSync('assets/market-2026.js','utf8');
          const loader=fs.readFileSync('assets/enhancements.js','utf8');
          const recovery=fs.readFileSync('assets/market-ui-recovery.js','utf8');
          const analysis=fs.readFileSync('assets/market-management-v2.js','utf8');
          const executive=fs.readFileSync('assets/market-executive-report-v2.js','utf8');
          const demandUi=fs.readFileSync('assets/market-demand-ui.js','utf8');
          const augment=fs.readFileSync('assets/market-management-augment.js','utf8');
          const guard=fs.readFileSync('assets/market-loading-guard.js','utf8');
          const switcher=fs.readFileSync('assets/market-view-switcher.js','utf8');
          const hypeUi=fs.readFileSync('assets/market-hype-ui.js','utf8');
          const hypeCss=fs.readFileSync('assets/market-hype-ui.css','utf8');
          const worker=fs.readFileSync('cloudflare/market-hype-refresh/worker.mjs','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const daily=fs.readFileSync('.github/workflows/market-2026-sync.yml','utf8');
          const salesFlow=fs.readFileSync('.github/workflows/market-sales-2026-sync.yml','utf8');
          const hypeFlow=fs.readFileSync('.github/workflows/market-hype-2026-sync.yml','utf8');
          const validator=fs.readFileSync('tools/validate-market-daily-2026.js','utf8');
          const expectedHash='113180da7cf6dcdea360d1d14de73ebb5c245ae582224c906012b9bf9395e615';
          if([data,registry,sales,demand,presence,hype,hypeCfg].some(x=>Number(x.scopeYear)!==2026))throw new Error('Market scope must remain 2026');
          if((registry.retailers||[]).length<22)throw new Error('National registry shrank below 22 validated storefronts');
          if(!(data.observations||[]).length)throw new Error('Market dataset has no observations');
          if(!market.includes(expectedHash)||!market.includes('trendSnapshots'))throw new Error('Market core/access/trend regression');
          if(!daily.includes("cron: '0 3 * * *'")||!daily.includes("cron: '0 4 * * *'")||!validator.includes('status.date!==today'))throw new Error('06:00/freshness architecture missing');
          for(const token of ['canonicalize-market-sales-products-2026.js','canonicalize-market-demand-products-2026.js','build-market-product-presence-2026.js','augment-market-management-presence-2026.js'])if(!salesFlow.includes(token))throw new Error('Canonical market pipeline missing '+token);
          if(!hypeFlow.includes("cron: '0 3 * * *'")||!hypeFlow.includes("cron: '0 4 * * *'")||!hypeFlow.includes('collect-market-hype-radar-2026.js'))throw new Error('Hype 06:00 workflow missing');
          for(const asset of ['/assets/market-loading-guard.js?v=9','/assets/market-ui-recovery.js?v=3','/assets/market-management-v2.js?v=3','/assets/market-executive-report-v2.js?v=2','/assets/market-demand-ui.js?v=2','/assets/market-hype-ui.js?v=3','/assets/market-management-augment.js?v=2','/assets/market-view-switcher.js?v=3'])if(!loader.includes(asset)||!sw.includes(asset))throw new Error('Loader/cache mismatch '+asset);
          if(!loader.includes('waitForMarketRoot')||!loader.includes('waitForId')||!loader.includes('hydrateSeries')||loader.indexOf('/assets/market-loading-guard.js?v=9')<loader.indexOf('/assets/market-view-switcher.js?v=3'))throw new Error('Guard must start after actual UI hydration');
          if(!recovery.includes("document.dispatchEvent(new CustomEvent('rta:market:hydrate'))")||!recovery.includes('n>=8')||!recovery.includes('market-executive-report-v2.js?v=2'))throw new Error('Persistent UI recovery missing');
          if(!analysis.includes("document.addEventListener('rta:market:hydrate',schedule)")||!analysis.includes('retries<30')||!analysis.includes('__rtaMarketAnalysisReady'))throw new Error('Analysis self-hydration retry missing');
          for(const [name,src] of [['executive',executive],['demand',demandUi],['hype',hypeUi],['augment',augment]]){
            if(!src.includes('if(el(ID)||loading)')||!src.includes("document.addEventListener('rta:market:hydrate',hydrate)"))throw new Error(name+' UI is not idempotent/self-hydrating');
          }
          if(!guard.includes('reloadUi(m)')||!guard.includes('hydrateMissing(n)')||!guard.includes('market-management-v2.js?v=3'))throw new Error('Guard active UI recovery missing');
          if(!sw.includes('/assets/market-hype-ui.css?v=2')||!sw.includes('/assets/market-view-switcher.css?v=3'))throw new Error('Hype CSS cache version mismatch');
          if(!switcher.includes('data-primary="hype"')||!switcher.includes('Hype Radar · 72h')||!switcher.includes('Details'))throw new Error('Analysis/Hype/Details navigation missing');
          if(!guard.includes('/data/market-product-presence-2026.json')||!guard.includes('/data/market-hype-radar-2026.json')||!guard.includes('market-loading-percent')||!guard.includes('marketViewSwitcher'))throw new Error('Atomic loading/progress guard incomplete');
          if(!worker.includes('progressForRun')||!worker.includes('/actions/runs/')||!worker.includes("kind:'hype-refresh'"))throw new Error('Real Hype refresh progress endpoint missing');
          if(!sw.includes("url.pathname.startsWith('/assets/market-')")||!sw.includes("url.pathname==='/assets/enhancements.js'")||!sw.includes("'/data/market-hype-radar-2026.json'"))throw new Error('Market/Hype assets are not network-first');
          if(!presence.methodology||!/Bestseller breadth/i.test(String(presence.methodology.truthRule||'')))throw new Error('Listing/bestseller truth rule missing');
          if(!sales.methodology||sales.methodology.noStockInference!==true)throw new Error('Sales layer must prohibit stock-based sales inference');
          if(sales.coverage&&sales.coverage.nationalMarketShareAvailable===true&&Number(sales.coverage.storefrontsWithActualUnitSales)!==(registry.retailers||[]).length)throw new Error('National market share claimed without full Tier-A coverage');
          if(Number(hype.schemaVersion)<3||hype.mode!=='pre-market-upstream-only'||!hype.truth||hype.truth.retailSourcesUsed!==false||hype.truth.commercialPagesRejected!==true)throw new Error('Hype v3 upstream-only truth rule missing');
          if(hype.truth.brandsExposed!==false||hype.truth.shopLinksExposed!==false||hype.truth.pricesExposed!==false||hype.truth.buyTrendRequiresDistinctAccounts!==true||hype.truth.complaintStopRequiresIndependentSources!==true)throw new Error('Hype public/decision truth rules missing');
          if(!hypeCfg.truthRules||hypeCfg.truthRules.retailIsNeverHype!==true||hypeCfg.truthRules.rejectCommercialPages!==true||!hypeCfg.truthRules.buyTrend||!hypeCfg.truthRules.stopOrLiquidate)throw new Error('Hype source configuration incomplete');
          for(const cat of ['RTA','MODURI','ACCESORII'])if(!Array.isArray(hype.categories&&hype.categories[cat]))throw new Error('Missing Hype category '+cat);
          for(const [cat,rows] of Object.entries(hype.categories||{}))for(const x of rows||[]){
            if(x.brand||x.url||x.price||x.shop||x.retailerId)throw new Error('Prohibited public Hype field leaked');
            const c=x.decision&&x.decision.code;
            if(c==='BUY_HYPE'&&!(x.newestSignalHours<336&&x.sourceTypeCount>=2&&x.velocityVerified===true&&Number(x.velocity7d)>=3))throw new Error('BUY_HYPE without every required condition');
            if(c==='BUY_TREND'&&!(Number(x.mentions7d)>=3&&Number(x.distinctAccounts7d)>=3))throw new Error('BUY_TREND without distinct-account evidence');
            if(c==='PREPARE_ACCESSORIES'&&cat!=='ACCESORII')throw new Error('Accessory preparation outside ACCESORII');
            if(c==='STOP_REVIEW'&&Number(x.complaintSourceCount||0)>0&&Number(x.complaintSourceCount)<3)throw new Error('Complaint stop without three independent sources');
          }
          if(!hypeUi.includes('DECIZIA DE ACUM')||!hypeUi.includes('BUY_TREND')||!hypeUi.includes('PREPARE_ACCESSORIES'))throw new Error('Executive Hype decisions missing from UI');
          if(/queriesWorking|rawDocuments|verified source dates/i.test(hypeUi))throw new Error('Technical internals leaked into Hype UI');
          if(!hypeUi.includes('hype-progress-ring')||!hypeUi.includes('fetchRefreshStatus'))throw new Error('Hype rescan progress UI missing');
          if(!/radial-gradient/.test(hypeCss)||!/#c13b65/.test(hypeCss)||!/#ffd34e/.test(hypeCss)||!/#4fdf86/.test(hypeCss)||!/#46b9ff/.test(hypeCss))throw new Error('Five-star black/porto/yellow/green/blue Hype visual system missing');
          console.log(`Market gate OK: ${(data.observations||[]).length} observations; ${(registry.retailers||[]).length} storefronts; deadlock-free atomic hydration ready.`);
          NODE
