name: Market 2026 Daily Sync

on:
  schedule:
    # 06:00 Europe/Bucharest. GitHub cron is UTC; DST is gated below.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sync-market-2026.js"
      - "tools/sync-market-smokee-2026.js"
      - "tools/sync-market-specialized-2026.js"
      - "tools/verify-market-prices-2026.js"
      - "tools/normalize-market-2026.js"
      - "tools/market-coverage-audit-2026.js"
      - "tools/validate-market-daily-2026.js"
      - "data/market-retailers-2026.json"
      - ".github/workflows/market-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-daily-sync
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate 06:00 Bucharest
        id: gate
        shell: bash
        run: |
          run_sync=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=Europe/Bucharest date +%z)"
            cron="${{ github.event.schedule }}"
            if { [ "$offset" = "+0300" ] && [ "$cron" != "0 3 * * *" ]; } || { [ "$offset" = "+0200" ] && [ "$cron" != "0 4 * * *" ]; }; then run_sync=false; fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect national storefronts
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/sync-market-2026.js --write

      - name: Collect Smokee API families
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/sync-market-smokee-2026.js --write

      - name: Run dedicated storefront parsers
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/sync-market-specialized-2026.js --write

      - name: Verify suspicious prices at source
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/verify-market-prices-2026.js --write

      - name: Normalize observations
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/normalize-market-2026.js --write

      - name: Audit national coverage
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/market-coverage-audit-2026.js --write

      - name: Validate truth and freshness
        if: steps.gate.outputs.run_sync == 'true'
        run: |
          for f in tools/sync-market-2026.js tools/sync-market-smokee-2026.js tools/sync-market-specialized-2026.js tools/verify-market-prices-2026.js tools/normalize-market-2026.js tools/market-coverage-audit-2026.js tools/validate-market-daily-2026.js assets/market-2026.js assets/market-2026-report.js assets/market-coverage-ui.js assets/market-sales-ui.js; do node --check "$f"; done
          node tools/validate-market-daily-2026.js

      - name: Publish daily market snapshot
        if: steps.gate.outputs.run_sync == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/market-2026.json data/market-history-2026 data/market-coverage-2026.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-2026.json data/market-history-2026 data/market-coverage-2026.json
          git commit -m "Snapshot Romania RTA market 2026"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
