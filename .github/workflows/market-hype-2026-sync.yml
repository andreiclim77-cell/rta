name: Market 2026 Hype Radar

on:
  schedule:
    # 06:00 Europe/Bucharest; DST gated below.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/collect-market-hype-radar-2026.js"
      - "tools/collect-market-hype-deep-2026.js"
      - "tools/filter-market-hype-evidence-2026.js"
      - "tools/collect-market-hype-wide-2026.js"
      - "tools/collect-market-hype-products-2026.js"
      - "tools/collect-market-hype-vendor-direct-2026.js"
      - "tools/collect-market-hype-targeted-vendor-2026.js"
      - "tools/augment-market-hype-explicit-vendor-dates-2026.js"
      - "tools/augment-market-hype-3fvape-newarrival-rta-2026.js"
      - "tools/collect-market-hype-vendor-pagination-2026.js"
      - "tools/collect-market-hype-vendor-profiles-v2-2026.js"
      - "data/market-hype-sources-2026.json"
      - "data/market-hype-vendor-profiles-2026.json"
      - ".github/workflows/market-hype-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-hype-radar
  cancel-in-progress: true

jobs:
  collect-hype-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate 06:00 Bucharest
        id: gate
        shell: bash
        run: |
          run_sync=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=Europe/Bucharest date +%z)"
            cron="${{ github.event.schedule }}"
            if { [ "$offset" = "+0300" ] && [ "$cron" != "0 3 * * *" ]; } || { [ "$offset" = "+0200" ] && [ "$cron" != "0 4 * * *" ]; }; then run_sync=false; fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect strict upstream pre-announcement trend and risk signals
        if: steps.gate.outputs.run_sync == 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_DATA_API_APPROVED: ${{ secrets.REDDIT_DATA_API_APPROVED }}
        run: node tools/collect-market-hype-radar-2026.js --write

      - name: Deep upstream second pass
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-deep-2026.js --write

      - name: Strictly validate upstream evidence hosts
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/filter-market-hype-evidence-2026.js --write

      - name: Global 30-day wide discovery and After the first heart-beat
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-wide-2026.js --write

      - name: Resolve concrete products and reject relistings / generic false positives
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-products-2026.js --write

      - name: Direct vendor product pages - ETA batch and release verification
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-vendor-direct-2026.js --write

      - name: Targeted vendor search - next batch ETA pre-sale
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-targeted-vendor-2026.js --write

      - name: Explicit vendor date phrases - verified ETA and batch
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/augment-market-hype-explicit-vendor-dates-2026.js --write

      - name: 3FVape RTA catalog - resolve dated new-arrival product paths
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/augment-market-hype-3fvape-newarrival-rta-2026.js --write

      - name: Global multi-vendor profiles - catalog pagination and product verification
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-vendor-pagination-2026.js --write

      - name: Robust concrete product titles - final multi-vendor resolver
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-vendor-profiles-v2-2026.js --write

      - name: Validate Hype global 30-day truth rules
        if: steps.gate.outputs.run_sync == 'true'
        run: |
          node --check tools/collect-market-hype-radar-2026.js
          node --check tools/collect-market-hype-deep-2026.js
          node --check tools/filter-market-hype-evidence-2026.js
          node --check tools/collect-market-hype-wide-2026.js
          node --check tools/collect-market-hype-products-2026.js
          node --check tools/collect-market-hype-vendor-direct-2026.js
          node --check tools/collect-market-hype-targeted-vendor-2026.js
          node --check tools/augment-market-hype-explicit-vendor-dates-2026.js
          node --check tools/augment-market-hype-3fvape-newarrival-rta-2026.js
          node --check tools/collect-market-hype-vendor-pagination-2026.js
          node --check tools/collect-market-hype-vendor-profiles-v2-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/market-hype-radar-2026.json','utf8'));
          const e=JSON.parse(fs.readFileSync('data/market-hype-evidence-2026.json','utf8'));
          const h=JSON.parse(fs.readFileSync('data/market-hype-heartbeat-2026.json','utf8'));
          const he=JSON.parse(fs.readFileSync('data/market-hype-heartbeat-evidence-2026.json','utf8'));
          const p=JSON.parse(fs.readFileSync('data/market-hype-products-2026.json','utf8'));
          if([d,e,h,he,p].some(x=>Number(x.scopeYear)!==2026))throw new Error('Hype scope must remain 2026');
          if(Number(d.schemaVersion)<4||Number(d.hypeWindowDays)!==30||Number(d.lookbackHours)!==720)throw new Error('Global Hype 30d core did not run');
          if(d.mode!=='pre-market-upstream-only'||!d.truth||d.truth.globalScope!==true||d.truth.productRelevanceValidated!==true)throw new Error('Global/product Hype boundary missing');
          if(!d.sourceStatus||d.sourceStatus.deepScan!==true||d.sourceStatus.deepStrictHostValidated!==true||d.sourceStatus.wideScan!==true||d.sourceStatus.scope!=='GLOBAL')throw new Error('Deep/global Hype passes incomplete');
          if(e.mode!=='hype-source-evidence'||!e.truth||e.truth.productRelevanceValidated!==true)throw new Error('Product Hype evidence missing');
          if(h.mode!=='after-first-heart-beat'||Number(h.windowDays)!==30||h.scope!=='GLOBAL RTA + clone RTA'||!Array.isArray(h.releasedLast30Days))throw new Error('Heartbeat missing');
          if(he.mode!=='after-first-heart-beat-evidence'||Number(he.windowDays)!==30||he.productRelevanceValidated!==true)throw new Error('Heartbeat evidence missing');
          if(Number(p.schemaVersion)<14||Number(p.windowDays)!==30||p.scope!=='GLOBAL RTA + clone RTA'||p.pendingRefresh===true||!Array.isArray(p.products))throw new Error('Product-title V2 Hype snapshot invalid');
          if(!p.truth||p.truth.productLevelOnly!==true||p.truth.newArrivalIsNotRelease!==true||p.truth.afterReleaseRequiresExplicitDate!==true||p.truth.relistingIsNotRelease!==true||p.truth.vendorProfileScan!==true||p.truth.multiVendor!==true||p.truth.transportRtaRejected!==true||p.truth.concreteProductTitles!==true||p.truth.genericVendorTitlesRejected!==true)throw new Error('Product-title/relisting truth contract missing');
          if(!p.scan||!Array.isArray(p.scan.profilesV2)||p.scan.profilesV2.length<4||Number(p.scan.productPagesV2)<1)throw new Error('Product-title V2 crawler did not reach real product pages');
          const banned=/dictionary\.|steampowered\.com|cbsnews\.com|(^|\.)rta\.ae|rtafleet\.com|(^|\.)rta\.com|merriam-webster|riversidetransit|riderta/i;
          const generic=/^(3fvape|2fdeal|shareavape|ecigone|sourcemore)$/i;
          for(const x of p.products){
            if(!x.id||!x.productName||!['RTA','MODURI','ACCESORII'].includes(x.category)||!x.typology||!['before','after'].includes(x.window))throw new Error('Incomplete product-level Hype row');
            if(generic.test(String(x.productName).trim()))throw new Error('Generic vendor name leaked as product: '+x.productName);
            for(const s of x.sources||[])if(banned.test(String(s.host||s.url||'')))throw new Error('Generic false positive leaked: '+String(s.host||s.url));
            if(x.window==='after'&&(x.dateConfidence!=='explicit'||Math.abs(Date.now()-Date.parse(x.eventDate))/36e5>720))throw new Error('Invalid after-release date: '+x.productName);
          }
          for(const x of h.releasedLast30Days||[])if(x.dateConfidence!=='explicit'||Number(x.ageHours)>720)throw new Error('Heartbeat contains undated/old event');
          console.log(`Hype V2 gate OK: products ${p.products.length}; before ${p.summary.before}; after ${p.summary.after}; profiles ${p.scan.profilesV2.length}; pages ${p.scan.productPagesV2}; events ${p.scan.eventsV2}.`);
          NODE

      - name: Publish complete Hype, product and heartbeat snapshots
        if: steps.gate.outputs.run_sync == 'true'
        shell: bash
        run: |
          files="data/market-hype-radar-2026.json data/market-hype-evidence-2026.json data/market-hype-heartbeat-2026.json data/market-hype-heartbeat-evidence-2026.json data/market-hype-products-2026.json"
          if [ -z "$(git status --porcelain -- $files)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Snapshot product-level global 30-day Hype Radar 2026"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
