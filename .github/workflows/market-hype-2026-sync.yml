name: Market 2026 Hype Radar

on:
  schedule:
    # 06:00 and 06:20 Europe/Bucharest in summer and winter; local-time gated below.
    - cron: '0,20 3 * * *'
    - cron: '0,20 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/collect-market-hype-radar-2026.js"
      - "tools/run-market-hype-radar-2026.js"
      - "tools/collect-market-hype-deep-2026.js"
      - "tools/filter-market-hype-evidence-2026.js"
      - "tools/collect-market-hype-wide-2026.js"
      - "tools/collect-market-hype-products-2026.js"
      - "tools/collect-market-hype-active-makers-2026.js"
      - "tools/collect-market-hype-vendor-direct-2026.js"
      - "tools/collect-market-hype-targeted-vendor-2026.js"
      - "tools/augment-market-hype-explicit-vendor-dates-2026.js"
      - "tools/augment-market-hype-search-index-eta-2026.js"
      - "tools/augment-market-hype-3fvape-newarrival-rta-2026.js"
      - "tools/collect-market-hype-vendor-pagination-2026.js"
      - "tools/collect-market-hype-vendor-profiles-v2-2026.js"
      - "tools/hype-window-reference-2026.js"
      - "tools/hype-upstream-page-title-resolver.js"
      - "tools/augment-market-hype-recent-release-observer-2026.js"
      - "tools/augment-market-hype-current-vendor-rta-events-2026.js"
      - "tools/augment-market-hype-preorder-card-events-2026.js"
      - "tools/collect-market-hype-pods-2026.js"
      - "tools/market-pod-classifier-2026.js"
      - "tools/observe-market-hype-retail-first-seen-2026.js"
      - "tools/collect-market-hype-direct-catalogs-2026.js"
      - "tools/collect-market-hype-dated-news-2026.js"
      - "tools/collect-market-hype-retail-campaigns-2026.js"
      - "tools/backfill-market-hype-product-evidence-2026.js"
      - "tools/consolidate-market-hype-2026.js"
      - "tools/validate-market-hype-pods-2026.js"
      - "tools/check-market-data-quality-2026.js"
      - "tools/market-product-canonical-2026.js"
      - "tools/market-hype-accessory-classifier-2026.js"
      - "tools/enforce-market-hype-symmetric-window-2026.js"
      - "tools/merge-market-hype-upstream-products-v2-2026.js"
      - "tools/finalize-market-hype-category-relevance-2026.js"
      - "tools/merge-market-hype-upstream-products-2026.js"
      - "tools/validate-market-hype-publish-2026.js"
      - "data/market-hype-sources-2026.json"
      - "data/market-hype-known-history-2026.json"
      - "data/market-pod-universe-2026.json"
      - "data/market-hype-active-makers-extra-2026.json"
      - "data/market-hype-vendor-profiles-2026.json"
      - "data/market-pod-universe-2026.json"
      - "assets/market-hype-ui.js"
      - "assets/market-hype-ui.css"
      - ".github/workflows/market-hype-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-hype-radar
  cancel-in-progress: false

jobs:
  collect-hype-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Gate exact 06:00 and 06:20 Bucharest runs
        id: gate
        shell: bash
        run: |
          run_sync=true
          fallback=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_time="$(TZ=Europe/Bucharest date +%H:%M)"
            if [ "$local_time" = "06:00" ]; then fallback=false
            elif [ "$local_time" = "06:20" ]; then fallback=true
            else run_sync=false
            fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether fallback Hype refresh is needed
        if: steps.gate.outputs.run_sync == 'true'
        id: refresh
        shell: bash
        run: |
          run_hype=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.gate.outputs.fallback }}" = "true" ]; then
            if node - <<'NODE'
          const fs=require('fs');
          const {referenceIso}=require('./tools/hype-window-reference-2026.js');
          try{
            const files=['data/market-hype-products-2026.json','data/market-hype-pods-2026.json','data/market-hype-radar-2026.json','data/market-hype-direct-catalogs-2026.json','data/market-hype-dated-news-2026.json','data/market-hype-retail-campaigns-2026.json'];
            const expected=referenceIso();
            const docs=files.map(file=>JSON.parse(fs.readFileSync(file,'utf8')));
            if(docs.every(doc=>doc.snapshotReferenceAt===expected&&doc.pendingRefresh!==true))process.exit(0);
          }catch(_){ }
          process.exit(1);
          NODE
            then
              echo "06:00 Hype snapshot is complete; the 06:20 recovery run is not needed."
              run_hype=false
            fi
          fi
          echo "run_hype=$run_hype" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect strict upstream pre-announcement trend and risk signals
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_DATA_API_APPROVED: ${{ secrets.REDDIT_DATA_API_APPROVED }}
        run: node tools/run-market-hype-radar-2026.js --write

      - name: Deep upstream second pass
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-deep-2026.js --write

      - name: Strictly validate upstream evidence hosts
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/filter-market-hype-evidence-2026.js --write

      - name: Global 30-day wide discovery and After the first heart-beat
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-wide-2026.js --write

      - name: Preserve global upstream evidence before product enrichment
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: |
          cp data/market-hype-evidence-2026.json /tmp/market-hype-upstream-evidence-2026.json
          cp data/market-hype-heartbeat-evidence-2026.json /tmp/market-hype-upstream-heartbeat-evidence-2026.json

      - name: Resolve concrete products and reject relistings / generic false positives
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-products-2026.js --write

      - name: Direct vendor product pages - ETA batch and release verification
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-vendor-direct-2026.js --write

      - name: Targeted vendor search - next batch ETA pre-sale
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-targeted-vendor-2026.js --write

      - name: Explicit vendor date phrases - verified ETA and batch
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/augment-market-hype-explicit-vendor-dates-2026.js --write

      - name: Public search-index ETA recovery - batch and delayed product dates
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/augment-market-hype-search-index-eta-2026.js --write

      - name: 3FVape RTA catalog - resolve dated new-arrival product paths
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/augment-market-hype-3fvape-newarrival-rta-2026.js --write

      - name: Global multi-vendor profiles - catalog pagination and product verification
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-vendor-pagination-2026.js --write

      - name: Robust concrete product titles - final multi-vendor resolver
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-vendor-profiles-v2-2026.js --write

      - name: Supplemental active makers - RTA and MODURI
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-active-makers-2026.js --write

      - name: Merge global, direct-release and vendor product signals
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/merge-market-hype-upstream-products-2026.js --write

      - name: Enforce exact 30 days before and 30 days after
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/enforce-market-hype-symmetric-window-2026.js --write

      - name: Discover POD announcements, launches and dated public signals
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-pods-2026.js --write

      - name: Update 180-day retailer memory and first-seen observations
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/observe-market-hype-retail-first-seen-2026.js --write

      - name: Scan direct official and retailer product catalogs
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-direct-catalogs-2026.js --write

      - name: Collect dated manufacturer, press and product publications
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-dated-news-2026.js --write

      - name: Recover explicit future batch and preorder dates
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/augment-market-hype-preorder-card-events-2026.js --write

      - name: Record dated retail promotions only as public signals
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/collect-market-hype-retail-campaigns-2026.js --write

      - name: Backfill product-level dated evidence across public sources
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/backfill-market-hype-product-evidence-2026.js --write

      - name: Final category, chronology and cross-source arbitration
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: node tools/consolidate-market-hype-2026.js --write

      - name: Validate Hype global 30-day truth rules
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        run: |
          node --check tools/collect-market-hype-radar-2026.js
          node --check tools/run-market-hype-radar-2026.js
          node --check tools/collect-market-hype-deep-2026.js
          node --check tools/filter-market-hype-evidence-2026.js
          node --check tools/collect-market-hype-wide-2026.js
          node --check tools/collect-market-hype-products-2026.js
          node --check tools/collect-market-hype-active-makers-2026.js
          node --check tools/collect-market-hype-vendor-direct-2026.js
          node --check tools/collect-market-hype-targeted-vendor-2026.js
          node --check tools/augment-market-hype-explicit-vendor-dates-2026.js
          node --check tools/augment-market-hype-search-index-eta-2026.js
          node --check tools/augment-market-hype-3fvape-newarrival-rta-2026.js
          node --check tools/collect-market-hype-vendor-pagination-2026.js
          node --check tools/collect-market-hype-vendor-profiles-v2-2026.js
          node --check tools/hype-window-reference-2026.js
          node --check tools/hype-upstream-page-title-resolver.js
          node --check tools/augment-market-hype-recent-release-observer-2026.js
          node --check tools/augment-market-hype-current-vendor-rta-events-2026.js
          node --check tools/augment-market-hype-preorder-card-events-2026.js
          node --check tools/collect-market-hype-pods-2026.js
          node --check tools/market-pod-classifier-2026.js
          node --check tools/observe-market-hype-retail-first-seen-2026.js
          node --check tools/collect-market-hype-direct-catalogs-2026.js
          node --check tools/collect-market-hype-dated-news-2026.js
          node --check tools/collect-market-hype-retail-campaigns-2026.js
          node --check tools/backfill-market-hype-product-evidence-2026.js
          node --check tools/consolidate-market-hype-2026.js
          node --check tools/validate-market-hype-pods-2026.js
          node --check tools/check-market-data-quality-2026.js
          node --check tools/market-product-canonical-2026.js
          node --check tools/market-hype-accessory-classifier-2026.js
          node --check tools/enforce-market-hype-symmetric-window-2026.js
          node --check tools/merge-market-hype-upstream-products-v2-2026.js
          node --check tools/finalize-market-hype-category-relevance-2026.js
          node --check tools/merge-market-hype-upstream-products-2026.js
          node --check tools/validate-market-hype-publish-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const extra=JSON.parse(fs.readFileSync('data/market-hype-active-makers-extra-2026.json','utf8'));
          const names=new Set();
          for(const m of extra.activeMakers||[]){const k=String(m.name||'').toLowerCase();if(!k)throw new Error('Empty active maker');if(names.has(k))throw new Error('Duplicate active maker: '+m.name);names.add(k)}
          if(names.size<40)throw new Error('Supplemental active-maker registry unexpectedly small');
          console.log(`Active-maker registry gate: ${names.size} supplemental makers, deduplicated.`);
          NODE
          node tools/validate-market-hype-publish-2026.js
          node tools/validate-market-hype-pods-2026.js
          node tools/check-market-data-quality-2026.js

      - name: Publish complete Hype, product and heartbeat snapshots
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_hype == 'true'
        shell: bash
        run: |
          files="data/market-hype-radar-2026.json data/market-hype-evidence-2026.json data/market-hype-heartbeat-2026.json data/market-hype-heartbeat-evidence-2026.json data/market-hype-products-2026.json data/market-hype-pods-2026.json data/market-hype-direct-catalogs-2026.json data/market-hype-dated-news-2026.json data/market-hype-retail-campaigns-2026.json data/market-hype-retail-memory-2026.json data/market-hype-discovery-ledger-2026.json"
          if [ -z "$(git status --porcelain -- $files)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Refresh verified RTA, mod and POD Hype radar"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
