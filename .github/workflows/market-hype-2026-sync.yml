name: Market 2026 Hype Radar

on:
  schedule:
    # 06:00 Europe/Bucharest; DST gated below.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/collect-market-hype-radar-2026.js"
      - "tools/run-market-hype-radar-2026.js"
      - "tools/collect-market-hype-deep-2026.js"
      - "tools/filter-market-hype-evidence-2026.js"
      - "tools/collect-market-hype-wide-2026.js"
      - "tools/collect-market-hype-products-2026.js"
      - "tools/collect-market-hype-vendor-direct-2026.js"
      - "tools/collect-market-hype-targeted-vendor-2026.js"
      - "tools/augment-market-hype-explicit-vendor-dates-2026.js"
      - "tools/augment-market-hype-3fvape-newarrival-rta-2026.js"
      - "tools/collect-market-hype-vendor-pagination-2026.js"
      - "tools/collect-market-hype-vendor-profiles-v2-2026.js"
      - "tools/hype-window-reference-2026.js"
      - "tools/hype-upstream-page-title-resolver.js"
      - "tools/augment-market-hype-recent-release-observer-2026.js"
      - "tools/augment-market-hype-current-vendor-rta-events-2026.js"
      - "tools/merge-market-hype-upstream-products-v2-2026.js"
      - "tools/finalize-market-hype-category-relevance-2026.js"
      - "tools/merge-market-hype-upstream-products-2026.js"
      - "tools/validate-market-hype-publish-2026.js"
      - "data/market-hype-sources-2026.json"
      - "data/market-hype-vendor-profiles-2026.json"
      - ".github/workflows/market-hype-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-hype-radar
  cancel-in-progress: true

jobs:
  collect-hype-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate 06:00 Bucharest
        id: gate
        shell: bash
        run: |
          run_sync=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=Europe/Bucharest date +%z)"
            cron="${{ github.event.schedule }}"
            if { [ "$offset" = "+0300" ] && [ "$cron" != "0 3 * * *" ]; } || { [ "$offset" = "+0200" ] && [ "$cron" != "0 4 * * *" ]; }; then run_sync=false; fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect strict upstream pre-announcement trend and risk signals
        if: steps.gate.outputs.run_sync == 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_DATA_API_APPROVED: ${{ secrets.REDDIT_DATA_API_APPROVED }}
        run: node tools/run-market-hype-radar-2026.js --write

      - name: Deep upstream second pass
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-deep-2026.js --write

      - name: Strictly validate upstream evidence hosts
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/filter-market-hype-evidence-2026.js --write

      - name: Global 30-day wide discovery and After the first heart-beat
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-wide-2026.js --write

      - name: Preserve global upstream evidence before product enrichment
        if: steps.gate.outputs.run_sync == 'true'
        run: |
          cp data/market-hype-evidence-2026.json /tmp/market-hype-upstream-evidence-2026.json
          cp data/market-hype-heartbeat-evidence-2026.json /tmp/market-hype-upstream-heartbeat-evidence-2026.json

      - name: Resolve concrete products and reject relistings / generic false positives
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-products-2026.js --write

      - name: Direct vendor product pages - ETA batch and release verification
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-vendor-direct-2026.js --write

      - name: Targeted vendor search - next batch ETA pre-sale
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-targeted-vendor-2026.js --write

      - name: Explicit vendor date phrases - verified ETA and batch
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/augment-market-hype-explicit-vendor-dates-2026.js --write

      - name: 3FVape RTA catalog - resolve dated new-arrival product paths
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/augment-market-hype-3fvape-newarrival-rta-2026.js --write

      - name: Global multi-vendor profiles - catalog pagination and product verification
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-vendor-pagination-2026.js --write

      - name: Robust concrete product titles - final multi-vendor resolver
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-market-hype-vendor-profiles-v2-2026.js --write

      - name: Merge global, direct-release and vendor product signals
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/merge-market-hype-upstream-products-2026.js --write

      - name: Validate Hype global 30-day truth rules
        if: steps.gate.outputs.run_sync == 'true'
        run: |
          node --check tools/collect-market-hype-radar-2026.js
          node --check tools/run-market-hype-radar-2026.js
          node --check tools/collect-market-hype-deep-2026.js
          node --check tools/filter-market-hype-evidence-2026.js
          node --check tools/collect-market-hype-wide-2026.js
          node --check tools/collect-market-hype-products-2026.js
          node --check tools/collect-market-hype-vendor-direct-2026.js
          node --check tools/collect-market-hype-targeted-vendor-2026.js
          node --check tools/augment-market-hype-explicit-vendor-dates-2026.js
          node --check tools/augment-market-hype-3fvape-newarrival-rta-2026.js
          node --check tools/collect-market-hype-vendor-pagination-2026.js
          node --check tools/collect-market-hype-vendor-profiles-v2-2026.js
          node --check tools/hype-window-reference-2026.js
          node --check tools/hype-upstream-page-title-resolver.js
          node --check tools/augment-market-hype-recent-release-observer-2026.js
          node --check tools/augment-market-hype-current-vendor-rta-events-2026.js
          node --check tools/merge-market-hype-upstream-products-v2-2026.js
          node --check tools/finalize-market-hype-category-relevance-2026.js
          node --check tools/merge-market-hype-upstream-products-2026.js
          node --check tools/validate-market-hype-publish-2026.js
          node tools/validate-market-hype-publish-2026.js

      - name: Publish complete Hype, product and heartbeat snapshots
        if: steps.gate.outputs.run_sync == 'true'
        shell: bash
        run: |
          files="data/market-hype-radar-2026.json data/market-hype-evidence-2026.json data/market-hype-heartbeat-2026.json data/market-hype-heartbeat-evidence-2026.json data/market-hype-products-2026.json"
          if [ -z "$(git status --porcelain -- $files)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Snapshot product-level global 30-day Hype Radar 2026"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
