name: Hype Global 30d Quality Gate

on:
  pull_request:
    paths:
      - 'data/market-hype-*.json'
      - 'data/market-pod-universe-2026.json'
      - 'tools/*market-hype*2026.js'
      - 'tools/market-pod-classifier-2026.js'
      - 'tools/market-product-canonical-2026.js'
      - 'tools/check-market-data-quality-2026.js'
      - 'assets/market-hype-*.js'
      - 'assets/market-hype-*.css'
      - 'assets/market-loading-guard.js'
      - 'assets/market-ui-recovery.js'
      - 'assets/market-view-switcher.js'
      - 'assets/market-source-info.js'
      - 'assets/market-access-policy.js'
      - 'assets/enhancements.js'
      - 'tools/check-market-report-final.js'
      - '.github/workflows/market-hype-2026-sync.yml'
      - '.github/workflows/market-hype-global-quality.yml'
      - 'sw.js'
  push:
    branches: [main]
    paths:
      - 'data/market-hype-*.json'
      - 'data/market-pod-universe-2026.json'
      - 'tools/*market-hype*2026.js'
      - 'tools/market-pod-classifier-2026.js'
      - 'tools/market-product-canonical-2026.js'
      - 'tools/check-market-data-quality-2026.js'
      - 'assets/market-hype-*.js'
      - 'assets/market-hype-*.css'
      - 'assets/market-loading-guard.js'
      - 'assets/market-ui-recovery.js'
      - 'assets/market-view-switcher.js'
      - 'assets/market-source-info.js'
      - 'assets/market-access-policy.js'
      - 'assets/enhancements.js'
      - 'tools/check-market-report-final.js'
      - '.github/workflows/market-hype-2026-sync.yml'
      - '.github/workflows/market-hype-global-quality.yml'
      - 'sw.js'

permissions:
  contents: read

jobs:
  validate-hype-global:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check tools/collect-market-hype-radar-2026.js
          node --check tools/collect-market-hype-deep-2026.js
          node --check tools/filter-market-hype-evidence-2026.js
          node --check tools/collect-market-hype-wide-2026.js
          node --check tools/collect-market-hype-products-2026.js
          node --check tools/collect-market-hype-vendor-pagination-2026.js
          node --check tools/collect-market-hype-vendor-profiles-v2-2026.js
          node --check tools/merge-market-hype-upstream-products-2026.js
          node --check tools/collect-market-hype-pods-2026.js
          node --check tools/market-pod-classifier-2026.js
          node --check tools/observe-market-hype-retail-first-seen-2026.js
          node --check tools/collect-market-hype-direct-catalogs-2026.js
          node --check tools/collect-market-hype-dated-news-2026.js
          node --check tools/collect-market-hype-retail-campaigns-2026.js
          node --check tools/backfill-market-hype-product-evidence-2026.js
          node --check tools/consolidate-market-hype-2026.js
          node --check tools/reconcile-market-hype-public-2026.js
          node --check tools/market-hype-verification-identity-2026.js
          node --check tools/test-market-hype-public-reconcile-2026.js
          node --check tools/validate-market-hype-pods-2026.js
          node --check tools/check-market-data-quality-2026.js
          node --check assets/market-hype-ui.js
          node --check assets/market-loading-guard.js
          node --check assets/market-access-policy.js
          node --check assets/enhancements.js
          node --check tools/check-market-report-final.js
          node --check sw.js
      - name: Contract
        run: |
          node tools/check-market-report-final.js
          node tools/reconcile-market-hype-public-2026.js --check
          node tools/test-market-hype-public-reconcile-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const json=p=>JSON.parse(read(p));
          const cfg=json('data/market-hype-sources-2026.json');
          const vendors=json('data/market-hype-vendor-profiles-2026.json');
          const flow=read('.github/workflows/market-hype-2026-sync.yml');
          const products=read('tools/collect-market-hype-products-2026.js');
          const multi=read('tools/collect-market-hype-vendor-pagination-2026.js');
          const v2=read('tools/collect-market-hype-vendor-profiles-v2-2026.js');
          const merge=read('tools/merge-market-hype-upstream-products-2026.js');
          const ui=read('assets/market-hype-ui.js');
          const guard=read('assets/market-loading-guard.js');
          const access=read('assets/market-access-policy.js');
          const sw=read('sw.js');
          const need=(ok,msg)=>{if(!ok)throw new Error(msg)};
          need(Number(cfg.lookbackHours)===720&&Number(cfg.hypeWindowDays)===30&&cfg.scope==='GLOBAL RTA + clone RTA','Hype must be GLOBAL / 30 days');
          need((cfg.officialMakers||[]).length>=35&&(cfg.cloneMakers||[]).length>=12&&(cfg.forumDomains||[]).length>=14,'Global source coverage too small');
          for(const d of ['2fdeal.com','3fvape.com','shareavape.com','sourcemore.com','facebook.com','instagram.com','youtube.com','ecigssa.co.za','vapoo.de'])need(JSON.stringify(cfg).toLowerCase().includes(d.toLowerCase()),'Missing Hype source '+d);
          need(Array.isArray(vendors.profiles)&&vendors.profiles.length>=5,'Multi-vendor profile coverage too small');
          for(const d of ['3fvape.com','2fdeal.com','shareavape.com','ecigone.co.uk','sourcemore.com'])need(vendors.profiles.some(x=>x.domain===d),'Missing direct vendor profile '+d);
          need((vendors.searchOnlyDomains||[]).includes('3avape.com')&&(vendors.searchOnlyDomains||[]).includes('vapingbest.com'),'Search-only vendor coverage missing');
          need(flow.includes('collect-market-hype-vendor-profiles-v2-2026.js --write')&&flow.includes('collect-market-hype-pods-2026.js --write')&&flow.includes('consolidate-market-hype-2026.js --write')&&flow.includes('reconcile-market-hype-public-2026.js --write')&&flow.includes('data/market-hype-pods-2026.json'),'RTA/MOD/POD multi-source pass/publish missing');
          need(products.includes('newArrivalIsNotRelease:true')&&products.includes('relistingIsNotRelease:true'),'Release/relisting protection missing');
          need(multi.includes('vendorProfileScan:true')&&multi.includes('transportRtaRejected:true')&&multi.includes('multiVendor:true'),'Multi-vendor truth protections missing');
          need(v2.includes('concreteProductTitles:true')&&v2.includes('genericVendorTitlesRejected:true'),'Concrete title resolver missing');
          need(multi.includes("const VCFG='data/market-hype-vendor-profiles-2026.json'")&&multi.includes('allowPreviewPublicationDate'),'Config-driven vendor/preview discovery missing');
          need(products.includes('BANNED_HOSTS')&&products.includes('steampowered')&&products.includes('dictionary'),'False-positive blacklist missing');
          need(merge.includes('upstreamEvidenceMerged:true')&&merge.includes('release-observed')&&merge.includes('observedReleaseIsNotClaimedAsExactReleaseDate:true'),'Truthful upstream/release-observed merge missing');
          need(ui.includes('hype-category-button')&&ui.includes('hype-product-card')&&ui.includes('productName')&&ui.includes('brandLabel')&&ui.includes('release-observed'),'Expandable observed-release Hype UI missing');
          need(!ui.includes('class="hype-direct"')&&!ui.includes("t('Acum','Now')")&&ui.includes('data-hype-layer="launches"')&&ui.includes('data-hype-layer="signals"')&&ui.includes('data-hype-layer="catalog"'),'Evidence layers or legacy automatic conclusion regression');
          need(guard.includes("key:'hypeProducts'")&&guard.includes("key:'hypePods'")&&guard.includes('validAfterProduct')&&guard.includes('catalog-published-at'),'Atomic loader does not validate final RTA/MOD/POD data');
          need(access.includes("autocomplete','new-password")&&access.includes("input.value=''"),'Password may be prefilled');
          need(sw.includes('/data/market-hype-products-2026.json')&&sw.includes('/data/market-hype-pods-2026.json')&&sw.includes('/data/market-hype-direct-catalogs-2026.json')&&sw.includes('ghid-rta-static-v46-analysis-buying'),'Product Hype cache/data contract missing');
          console.log('Hype Global gate OK: GLOBAL 30d; RTA/MOD/POD; dated events separated from public signals; anti-relisting memory; 06:00 + 06:20 recovery.');
          NODE
