name: Market Hype Preflight
on:
  push:
    branches: [market-truth-ui-preflight-LAST]
    paths:
      - "tools/collect-market-hype-radar-2026.js"
      - "data/market-hype-sources-2026.json"
      - "assets/market-hype-ui.js"
      - ".github/workflows/market-hype-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-hype:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check tools/collect-market-hype-radar-2026.js
          node --check assets/market-hype-ui.js
      - name: Run full upstream scan
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_DATA_API_APPROVED: ${{ secrets.REDDIT_DATA_API_APPROVED }}
        run: node tools/collect-market-hype-radar-2026.js --write
      - name: Truth gate
        run: |
          node - <<'NODE'
          const d=require('./data/market-hype-radar-2026.json');
          if(d.mode!=='pre-market-upstream-only'||d.truth.retailSourcesUsed!==false||d.truth.commercialPagesRejected!==true)throw new Error('Hype source separation failed');
          for(const rows of Object.values(d.categories||{}))for(const x of rows||[]){if(x.brand||x.url||x.price||x.shop||x.retailerId)throw new Error('Prohibited public Hype field leaked');if(x.decision&&x.decision.code==='BUY_HYPE'&&!(x.newestSignalHours<336&&x.sourceTypeCount>=2&&x.velocityVerified===true&&Number(x.velocity7d)>=3))throw new Error('BUY_HYPE truth rule failed')}
          console.log('Hype preflight OK',d.sourceStatus,d.summary);
          NODE
