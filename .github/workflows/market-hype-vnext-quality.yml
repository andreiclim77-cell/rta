name: HYPE vNext quality

on:
  pull_request:
    paths:
      - "tools/hype-vnext/**"
      - "data/hype-vnext/**"
      - "data/hype-benchmark/**"
      - "docs/HYPE_VNEXT_IMPLEMENTATION_STATUS.md"
      - "tools/consolidate-market-hype-2026.js"
      - "tools/validate-market-hype-publish-2026.js"
      - "tools/validate-market-hype-pods-2026.js"
      - "tools/check-market-data-quality-2026.js"
      - ".github/workflows/market-hype-2026-sync.yml"
      - ".github/workflows/market-hype-vnext-quality.yml"
  push:
    branches: [main]
    paths:
      - "tools/hype-vnext/**"
      - "data/hype-vnext/**"
      - "data/hype-benchmark/**"
      - "docs/HYPE_VNEXT_IMPLEMENTATION_STATUS.md"
      - "tools/consolidate-market-hype-2026.js"
      - "tools/validate-market-hype-publish-2026.js"
      - "tools/validate-market-hype-pods-2026.js"
      - "tools/check-market-data-quality-2026.js"
      - ".github/workflows/market-hype-2026-sync.yml"
      - ".github/workflows/market-hype-vnext-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HYPE Phase 0 and Phase 1 contracts
        run: |
          find tools/hype-vnext -name '*.js' -print0 | xargs -0 -n1 node --check
          node tools/hype-vnext/run-benchmark.js
          node tools/hype-vnext/build-phase1.js --check
          node tools/hype-vnext/tests/core-schema.test.js
          node tools/hype-vnext/tests/legacy-compat.test.js
      - name: Validate current public HYPE compatibility
        run: |
          node tools/validate-market-hype-publish-2026.js
          node tools/validate-market-hype-pods-2026.js
          node tools/check-market-data-quality-2026.js
          node tools/check-market-report-final.js
