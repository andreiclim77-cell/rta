name: Market Hype Refresh Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/market-hype-refresh/worker.mjs"
      - "cloudflare/market-hype-refresh/wrangler.toml"
      - ".github/workflows/market-hype-worker-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check optional deployment credentials
        id: cfg
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPE_GITHUB_TOKEN: ${{ secrets.HYPE_GITHUB_TOKEN }}
        run: |
          configured=false
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ] && [ -n "$HYPE_GITHUB_TOKEN" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then echo "Hype click-refresh deploy skipped: optional Cloudflare/GitHub deployment secrets are not configured."; fi
      - name: Deploy isolated Hype refresh worker
        if: steps.cfg.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/market-hype-refresh/wrangler.toml
      - name: Install private GitHub dispatch token in Worker
        if: steps.cfg.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPE_GITHUB_TOKEN: ${{ secrets.HYPE_GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$HYPE_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN --config cloudflare/market-hype-refresh/wrangler.toml
      - name: Verify endpoint
        if: steps.cfg.outputs.configured == 'true'
        shell: bash
        run: |
          code="$(curl -L --retry 3 --retry-delay 2 -sS -o /tmp/hype-health.json -w '%{http_code}' https://ghid-rta.ro/__market-hype-refresh)"
          cat /tmp/hype-health.json
          test "$code" = "200"
