name: Market 2026 Sales Signals

on:
  schedule:
    - cron: '20 4 * * *'
    - cron: '20 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sync-market-sales-2026.js"
      - "data/market-retailers-2026.json"
      - ".github/workflows/market-sales-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-sales-signals
  cancel-in-progress: true

jobs:
  collect-sales-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate Romania time
        id: gate
        shell: bash
        run: |
          run_sync=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=Europe/Bucharest date +%z)"
            cron="${{ github.event.schedule }}"
            if { [ "$offset" = "+0300" ] && [ "$cron" != "20 4 * * *" ]; } || { [ "$offset" = "+0200" ] && [ "$cron" != "20 5 * * *" ]; }; then run_sync=false; fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"
      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Collect real sales and bestseller signals
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/sync-market-sales-2026.js --write
      - name: Validate truth rules
        if: steps.gate.outputs.run_sync == 'true'
        run: |
          node --check tools/sync-market-sales-2026.js
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/market-sales-2026.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/market-retailers-2026.json','utf8'));
          if(Number(d.scopeYear)!==2026)throw new Error('Sales scope must be 2026');
          if(Number(d.coverage.storefrontsConfigured)!==(r.retailers||[]).length)throw new Error('Sales coverage denominator mismatch');
          for(const x of d.actualSales||[])if(!Number.isFinite(Number(x.unitsSold)))throw new Error('Non-explicit unitsSold row leaked');
          if(d.coverage.nationalUnitsSoldAvailable===true&&Number(d.coverage.storefrontsWithActualUnitSales)!==(r.retailers||[]).length)throw new Error('National sold-units claim became true without full coverage');
          console.log(`Sales truth gate: actual units ${d.coverage.storefrontsWithActualUnitSales}/${d.coverage.storefrontsConfigured}; public bestseller ranking ${d.coverage.storefrontsWithRetailerSalesRanking}/${d.coverage.storefrontsConfigured}.`);
          NODE
      - name: Publish sales snapshot
        if: steps.gate.outputs.run_sync == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/market-sales-2026.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-sales-2026.json
          git commit -m "Snapshot Romania RTA sales signals 2026"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
