name: Market 2026 Sales Signals

on:
  schedule:
    # 06:00 Europe/Bucharest; DST gated below.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/discover-market-sales-sources-2026.js"
      - "tools/sync-market-sales-2026.js"
      - "tools/collect-discovered-market-sales-2026.js"
      - "tools/probe-market-sales-counters-2026.js"
      - "tools/build-market-sales-summary-2026.js"
      - "tools/build-market-management-2026.js"
      - "data/market-sales-sources-2026.json"
      - "data/market-retailers-2026.json"
      - ".github/workflows/market-sales-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-sales-signals
  cancel-in-progress: true

jobs:
  collect-sales-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate 06:00 Bucharest
        id: gate
        shell: bash
        run: |
          run_sync=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=Europe/Bucharest date +%z)"
            cron="${{ github.event.schedule }}"
            if { [ "$offset" = "+0300" ] && [ "$cron" != "0 3 * * *" ]; } || { [ "$offset" = "+0200" ] && [ "$cron" != "0 4 * * *" ]; }; then run_sync=false; fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover retailer sales-ranking sources
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/discover-market-sales-sources-2026.js --write

      - name: Collect public sales evidence
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/sync-market-sales-2026.js --write

      - name: Verify dynamically discovered rankings
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/collect-discovered-market-sales-2026.js --write

      - name: Probe explicit product sales counters and demand signals
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/probe-market-sales-counters-2026.js --write

      - name: Build sales synthesis
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/build-market-sales-summary-2026.js --write

      - name: Build management decision intelligence
        if: steps.gate.outputs.run_sync == 'true'
        run: node tools/build-market-management-2026.js --write

      - name: Validate sales and management truth rules
        if: steps.gate.outputs.run_sync == 'true'
        run: |
          for f in tools/discover-market-sales-sources-2026.js tools/sync-market-sales-2026.js tools/collect-discovered-market-sales-2026.js tools/probe-market-sales-counters-2026.js tools/build-market-sales-summary-2026.js tools/build-market-management-2026.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/market-sales-2026.json','utf8'));
          const m=JSON.parse(fs.readFileSync('data/market-management-2026.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/market-retailers-2026.json','utf8'));
          const disc=JSON.parse(fs.readFileSync('data/market-sales-sources-discovered-2026.json','utf8'));
          if(Number(d.scopeYear)!==2026||Number(disc.scopeYear)!==2026||Number(m.scopeYear)!==2026)throw new Error('Market scope must be 2026');
          if(Number(d.coverage.storefrontsConfigured)!==(r.retailers||[]).length)throw new Error('Sales coverage denominator mismatch');
          for(const x of d.actualSales||[])if(!Number.isFinite(Number(x.unitsSold)))throw new Error('Non-explicit unitsSold row leaked');
          if(d.coverage.nationalMarketShareAvailable===true&&Number(d.coverage.storefrontsWithActualUnitSales)!==(r.retailers||[]).length)throw new Error('National share became true without full Tier-A coverage');
          if(!d.summary||!d.summary.observedBestsellerIndex)throw new Error('Sales synthesis missing');
          if(!d.productCounterProbeStatus)throw new Error('Product probe did not run');
          if(!m.periods||!m.periods['30']||!m.periods['30'].category||!m.periods['30'].brand||!m.periods['30'].product)throw new Error('Management dimensions missing');
          for(const dim of ['category','brand','product']) for(const row of (m.periods['30'][dim].rows||[])) {
            if(!Number.isFinite(Number(row.confidence))||!Number.isFinite(Number(row.priorityScore))) throw new Error(`Invalid management score: ${dim}/${row.name}`);
            if(!row.action||!row.action.code) throw new Error(`Missing management action: ${dim}/${row.name}`);
          }
          if(!/Prețul, stocul/.test(String(m.methodology&&m.methodology.truthRule||'')))throw new Error('Management truth rule must exclude price/stock as sales');
          console.log(`Decision gate: Tier-A ${m.coverage.tierAStores}/${m.coverage.configuredStores}; Tier-B ${m.coverage.tierBStores}/${m.coverage.configuredStores}; Tier-C ${m.coverage.tierCStores}/${m.coverage.configuredStores}; ranking snapshots ${m.coverage.rankingSnapshots}.`);
          NODE

      - name: Publish sales and management snapshot
        if: steps.gate.outputs.run_sync == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/market-sales-2026.json data/market-sales-sources-discovered-2026.json data/market-management-2026.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-sales-2026.json data/market-sales-sources-discovered-2026.json data/market-management-2026.json
          git commit -m "Snapshot Romania RTA market intelligence 2026"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
