name: Market 2026 Sales Signals

on:
  workflow_run:
    workflows: ["Market 2026 Daily Sync"]
    types: [completed]
  schedule:
    # Fallback at 07:30 Europe/Bucharest, after the Market 07:00 recovery slot.
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/discover-market-sales-sources-2026.js"
      - "tools/sync-market-sales-2026.js"
      - "tools/collect-discovered-market-sales-2026.js"
      - "tools/probe-market-sales-counters-2026.js"
      - "tools/market-product-canonical-2026.js"
      - "tools/market-sales-product-classifier-2026.js"
      - "tools/canonicalize-market-sales-products-2026.js"
      - "tools/build-market-product-presence-2026.js"
      - "tools/build-market-sales-summary-2026.js"
      - "tools/build-market-external-intelligence-2026.js"
      - "tools/collect-market-demand-intelligence-2026.js"
      - "tools/canonicalize-market-demand-products-2026.js"
      - "tools/build-market-management-2026.js"
      - "tools/augment-market-management-presence-2026.js"
      - "tools/build-market-public-analysis-2026.js"
      - "data/market-sales-sources-2026.json"
      - "data/market-retailers-2026.json"
      - "data/market-universe-discovery-2026.json"
      - "data/youtube-reviews.js"
      - ".github/workflows/market-sales-2026-sync.yml"

permissions:
  contents: write

concurrency:
  group: market-2026-sales-signals
  cancel-in-progress: true

jobs:
  collect-sales-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Gate chained or fallback Analysis refresh
        id: gate
        shell: bash
        run: |
          run_sync=true
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            run_sync=false
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=Europe/Bucharest date +%z)"
            cron="${{ github.event.schedule }}"
            if { [ "$offset" = "+0300" ] && [ "$cron" != "30 4 * * *" ]; } || { [ "$offset" = "+0200" ] && [ "$cron" != "30 5 * * *" ]; }; then run_sync=false; fi
          fi
          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether Analysis should run
        if: steps.gate.outputs.run_sync == 'true'
        id: refresh
        shell: bash
        run: |
          run_analysis=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if node - <<'NODE'
          const fs=require('fs');
          const day=v=>{const d=new Date(v);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bucharest',year:'numeric',month:'2-digit',day:'2-digit'}).format(d):''};
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bucharest',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          try{
            const m=JSON.parse(fs.readFileSync('data/market-management-2026.json','utf8'));
            const b=JSON.parse(fs.readFileSync('data/market-2026.json','utf8'));
            if(day(m.generatedAt)===today && b.collectorStatus && b.collectorStatus.date===today) process.exit(0);
          }catch(_){ }
          process.exit(1);
          NODE
            then run_analysis=false; fi
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            if ! node - <<'NODE'
          const fs=require('fs');
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bucharest',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          try{
            const b=JSON.parse(fs.readFileSync('data/market-2026.json','utf8'));
            if(b.collectorStatus && b.collectorStatus.date===today) process.exit(0);
          }catch(_){ }
          process.exit(1);
          NODE
            then
              echo "Technical push detected before today's 06:00 Market snapshot; Analysis will refresh from the daily chain instead."
              run_analysis=false
            fi
          fi
          echo "run_analysis=$run_analysis" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require fresh 06:00 Market base for Analysis
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/market-2026.json','utf8'));
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bucharest',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          if(!d.collectorStatus||d.collectorStatus.date!==today)throw new Error(`Analysis base Market is stale: ${d.collectorStatus&&d.collectorStatus.date} vs ${today}`);
          console.log(`Analysis base Market fresh for ${today}.`);
          NODE

      - name: Discover retailer sales-ranking sources
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/discover-market-sales-sources-2026.js --write

      - name: Collect public sales evidence
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/sync-market-sales-2026.js --write

      - name: Verify dynamically discovered rankings
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/collect-discovered-market-sales-2026.js --write

      - name: Probe explicit product sales counters and demand signals
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/probe-market-sales-counters-2026.js --write

      - name: Canonicalize product identities before aggregation
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/canonicalize-market-sales-products-2026.js --write

      - name: Build canonical Romanian product presence
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/build-market-product-presence-2026.js --write

      - name: Build sales synthesis
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/build-market-sales-summary-2026.js --write

      - name: Build external demand and manufacturer radar
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/build-market-external-intelligence-2026.js --write

      - name: Collect Google and community demand intelligence
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_DATA_API_APPROVED: ${{ secrets.REDDIT_DATA_API_APPROVED }}
        run: node tools/collect-market-demand-intelligence-2026.js --write

      - name: Canonicalize Google and community product identities
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/canonicalize-market-demand-products-2026.js --write

      - name: Build management decision intelligence
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/build-market-management-2026.js --write

      - name: Add real listing breadth to management report
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: node tools/augment-market-management-presence-2026.js --write

      - name: Build compact public Analysis report
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: |
          node tools/build-market-public-analysis-2026.js --write
          node tools/test-market-public-analysis-2026.js

      - name: Validate sales, management and daily Analysis freshness
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        run: |
          for f in tools/discover-market-sales-sources-2026.js tools/sync-market-sales-2026.js tools/collect-discovered-market-sales-2026.js tools/probe-market-sales-counters-2026.js tools/market-product-canonical-2026.js tools/market-sales-product-classifier-2026.js tools/canonicalize-market-sales-products-2026.js tools/build-market-product-presence-2026.js tools/build-market-sales-summary-2026.js tools/build-market-external-intelligence-2026.js tools/collect-market-demand-intelligence-2026.js tools/canonicalize-market-demand-products-2026.js tools/build-market-management-2026.js tools/augment-market-management-presence-2026.js tools/build-market-public-analysis-2026.js tools/test-market-public-analysis-2026.js; do node --check "$f"; done
          node tools/check-market-report-final.js
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/market-sales-2026.json','utf8'));
          const e=JSON.parse(fs.readFileSync('data/market-external-intelligence-2026.json','utf8'));
          const q=JSON.parse(fs.readFileSync('data/market-demand-intelligence-2026.json','utf8'));
          const p=JSON.parse(fs.readFileSync('data/market-product-presence-2026.json','utf8'));
          const m=JSON.parse(fs.readFileSync('data/market-management-2026.json','utf8'));
          const a=JSON.parse(fs.readFileSync('data/market-analysis-public-2026.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/market-retailers-2026.json','utf8'));
          const base=JSON.parse(fs.readFileSync('data/market-2026.json','utf8'));
          const disc=JSON.parse(fs.readFileSync('data/market-sales-sources-discovered-2026.json','utf8'));
          const localDay=v=>{const x=new Date(v);return Number.isFinite(x.getTime())?new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bucharest',year:'numeric',month:'2-digit',day:'2-digit'}).format(x):''};
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Bucharest',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          if([d,disc,e,q,p,m,a].some(x=>Number(x.scopeYear)!==2026))throw new Error('Market scope must be 2026');
          if(!base.collectorStatus||base.collectorStatus.date!==today)throw new Error('Analysis used stale base Market snapshot');
          if(localDay(m.generatedAt)!==today)throw new Error(`Management Analysis stale: ${m.generatedAt}`);
          if(localDay(a.updatedAt)!==today)throw new Error(`Public Analysis stale: ${a.updatedAt}`);
          if(!d.summary||localDay(d.summary.generatedAt)!==today)throw new Error(`Sales Analysis stale: ${d.summary&&d.summary.generatedAt}`);
          if(Number(d.coverage.storefrontsConfigured)!==(r.retailers||[]).length)throw new Error('Sales coverage denominator mismatch');
          if(!d.canonicalization||!d.canonicalization.after)throw new Error('Canonical product reconciliation did not run');
          if(!q.canonicalization||!Number.isFinite(Number(q.canonicalization.canonicalProducts)))throw new Error('Demand canonicalization did not run');
          for(const x of d.actualSales||[])if(!Number.isFinite(Number(x.unitsSold)))throw new Error('Non-explicit unitsSold row leaked');
          if(d.coverage.nationalMarketShareAvailable===true&&Number(d.coverage.storefrontsWithActualUnitSales)!==(r.retailers||[]).length)throw new Error('National share became true without full Tier-A coverage');
          if(!d.summary||!d.summary.observedBestsellerIndex)throw new Error('Sales synthesis missing');
          if(!d.productCounterProbeStatus)throw new Error('Product probe did not run');
          if(!p.methodology||!/Bestseller breadth/i.test(String(p.methodology.truthRule||'')))throw new Error('Product presence truth rule missing');
          if(!e.methodology||!e.methodology.youtubeEmerging||!e.methodology.youtubeEvergreen||!/cannot replace verified Romanian sales/i.test(String(e.methodology.truthRule||'')))throw new Error('External intelligence truth rule missing');
          if(!q.methodology||!/sales|vânzări/i.test(String(q.methodology.truthRule||'')))throw new Error('Demand intelligence truth rule missing');
          if(!m.periods||!m.periods['30']||!m.periods['30'].product)throw new Error('Management dimensions missing');
          for(const row of (m.periods['30'].product.rows||[])) {
            if(!Number.isFinite(Number(row.confidence))||!Number.isFinite(Number(row.priorityScore)))throw new Error(`Invalid management score: ${row.name}`);
            if(!row.action||!row.action.code||!row.buyDepth||!row.buyDepth.code)throw new Error(`Missing buyer guidance: ${row.name}`);
            if(!Number.isFinite(Number(row.listedStorefronts))||!Number.isFinite(Number(row.bestsellerStorefronts)))throw new Error(`Listing/bestseller separation missing: ${row.name}`);
          }
          if(!/Retail listing breadth/i.test(String(m.methodology&&m.methodology.listingBreadth||'')))throw new Error('Management listing-breadth truth rule missing');
          if(Number(a.schemaVersion)<2||!Array.isArray(a.observedPopularity)||!a.observedPopularity.length||!Array.isArray(a.buyingIdeas)||!a.buyingIdeas.length)throw new Error('Public Analysis sections missing');
          if(!a.observedPopularity.every(group=>Array.isArray(group.brands)&&Array.isArray(group.products))||!a.buyingIdeas.every(group=>Array.isArray(group.brands)&&Array.isArray(group.products)))throw new Error('Public Analysis brand/product views missing');
          if(!a.truth||a.truth.requestedStart!=='2026-01-01'||!a.truth.evidenceFirstObservedAt||a.truth.availabilityExcluded!==true||a.truth.buyingInterestSeparatedFromSales!==true||a.truth.historicalBackfillInvented!==false||a.truth.cumulativeRankingsNeverLabelledAsPeriodSales!==true||a.truth.operatorDateDeduplication!==true)throw new Error('Public Analysis truth contract missing');
          console.log(`Analysis daily gate: ${today}; Tier-A ${m.coverage.tierAStores}/${m.coverage.configuredStores}; Tier-B ${m.coverage.tierBStores}/${m.coverage.configuredStores}; canonical products ${p.summary.canonicalProducts}.`);
          NODE

      - name: Publish sales and management snapshot
        if: steps.gate.outputs.run_sync == 'true' && steps.refresh.outputs.run_analysis == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/market-sales-2026.json data/market-sales-sources-discovered-2026.json data/market-external-intelligence-2026.json data/market-demand-intelligence-2026.json data/market-product-presence-2026.json data/market-management-2026.json data/market-analysis-public-2026.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-sales-2026.json data/market-sales-sources-discovered-2026.json data/market-external-intelligence-2026.json data/market-demand-intelligence-2026.json data/market-product-presence-2026.json data/market-management-2026.json data/market-analysis-public-2026.json
          git commit -m "Snapshot Romania RTA market intelligence 2026"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
