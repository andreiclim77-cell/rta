name: RTA Guide Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "atomizoare/**"
      - "lichide/**"
      - "en/**"
      - "data/**"
      - "tools/**"
      - "rta-lab/**"
      - "sw.js"
      - "site.webmanifest"
      - "site-en.webmanifest"
      - "sitemap.xml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate scripts and JSON
        run: |
          node tools/validate-app-js.js
          node --check assets/enhancements.js
          node --check sw.js
          node --check data/youtube-reviews.js
          node --check tools/sync-smokee-mods.js
          node --check tools/facebook-publisher.js
          node --check tools/instagram-publisher.js
          node --check tools/social-reels-publisher.js
          node --check tools/meta-token-gate.js
          node --check tools/check-social-workflows.js
          node --check cloudflare/smokee-sync-backup/worker.mjs
          node --check rta-lab/engine.js
          node --check rta-lab/bootstrap.js
          node --check rta-lab/sw.js
          for file in rta-lab/data/*.js; do node --check "$file"; done
          test ! -e rta-lab/app.js
          test ! -e rta-lab/lab-update.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('rta-lab/data/wires.js', 'utf8'), sandbox);
          const wires = sandbox.window.RTA_WIRES || [];
          const ids = wires.map(wire => wire.id).sort();
          const expected = ['k128', 'k129', 'nife30'];
          if (JSON.stringify(ids) !== JSON.stringify(expected)) {
            throw new Error(`RTA Lab wires invalid: ${JSON.stringify(ids)}`);
          }
          const index = fs.readFileSync('rta-lab/index.html', 'utf8');
          if (!index.includes('engine.js')) throw new Error('RTA Lab index does not load engine.js');
          if (!index.includes('bootstrap.js')) throw new Error('RTA Lab index does not load bootstrap.js');
          if (index.includes('app.js') || index.includes('lab-update.js')) throw new Error('Obsolete Lab engines are still referenced');
          if (/K1 27|SS316L|Clapton/.test(index)) throw new Error('Obsolete wire cards are still present in Lab UI');
          NODE
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('site-en.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('sync-status.json','utf8')); JSON.parse(require('fs').readFileSync('data/facebook-publish-state.json','utf8')); JSON.parse(require('fs').readFileSync('data/instagram-publish-state.json','utf8')); JSON.parse(require('fs').readFileSync('data/social-reels-state.json','utf8'))"
      - name: Validate catalog and public pages
        run: |
          node tools/rewrite-smokee-images.js
          node tools/check-catalog-integrity.js
          node tools/check-youtube-review-data.js
          node tools/check-smokee-mods.js
          node tools/check-smokee-mod-fallback.js
          node tools/check-facebook-publisher.js
          node tools/check-instagram-publisher.js
          node tools/check-social-reels-publisher.js
          node tools/check-meta-token-gate.js
          node tools/check-social-workflows.js
          node tools/check-validation-queue.js
          node tools/facebook-publisher.js --check
          node tools/validate-seo-pages.js
