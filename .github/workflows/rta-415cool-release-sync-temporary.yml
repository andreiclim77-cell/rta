name: RTA 415 Cool generated assets sync (temporary)
on:
  pull_request:
    paths:
      - "rta-lab/**"
      - ".github/workflows/rta-415cool-release-sync-temporary.yml"
permissions:
  contents: write
jobs:
  sync-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic Atlas cache and release
        run: |
          node tools/build-rta-atlas-cache.js
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
      - name: Push generated UTF-8 files into PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas/sw.js rta-lab/atlas/index.html rta-lab/atlas/modules.js rta-lab/atlas/ATLAS_RELEASE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(atlas): sync 415 Cool generated release/cache'
            git push origin HEAD:refs/heads/feature/415-cool-personal-tc-7-6-k128-6-20261015
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rta-415cool-generated-assets
          path: |
            rta-lab/atlas-preview/sw.js
            rta-lab/atlas/sw.js
            rta-lab/atlas/index.html
            rta-lab/atlas/modules.js
            rta-lab/atlas/ATLAS_RELEASE_RECEIPT.json
          retention-days: 1
