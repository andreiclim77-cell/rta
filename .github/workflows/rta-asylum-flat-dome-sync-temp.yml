name: RTA Asylum Flat Dome deterministic release sync (temporary)
on:
  pull_request:
    paths:
      - "rta-lab/atlas-preview/**"
      - "rta-lab/atlas/**"
      - ".github/workflows/rta-asylum-flat-dome-sync-temp.yml"
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate Atlas-only cache and release
        run: |
          node tools/build-rta-atlas-cache.js
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
      - name: Commit checked-in generated assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas/index.html rta-lab/atlas/modules.js rta-lab/atlas/sw.js rta-lab/atlas/ATLAS_RELEASE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(atlas): sync Asylum personal Flat preference separately from Dome'
            git push origin HEAD:refs/heads/feature/atlas-asylum-air-and-complete-build-cards-20261016
          fi
