name: RTA GTR TC temporary generated-assets handoff
on:
  pull_request:
    paths:
      - "rta-lab/data/sensory-core.js"
      - "rta-lab/data/wires.js"
      - "rta-lab/atlas-preview/**"
      - ".github/workflows/rta-gtr-cache-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-cache-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild Atlas-only cache and release from checked-in source
        run: |
          node tools/build-rta-atlas-cache.js
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
      - name: Commit generated files only to the same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas/sw.js rta-lab/atlas/index.html rta-lab/atlas/modules.js rta-lab/atlas/ATLAS_RELEASE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(atlas): sync generated GTR TC release and isolated caches'
            git push origin HEAD:refs/heads/feature/gtr-nife30-7-nife52-6-20261015
          fi
      - name: Export only regenerated UTF-8 assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtr-nife-atlas-generated-assets
          path: |
            rta-lab/atlas-preview/sw.js
            rta-lab/atlas/sw.js
            rta-lab/atlas/index.html
            rta-lab/atlas/modules.js
            rta-lab/atlas/ATLAS_RELEASE_RECEIPT.json
          if-no-files-found: error
          retention-days: 1
