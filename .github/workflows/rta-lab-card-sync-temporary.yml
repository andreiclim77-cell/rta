name: RTA Lab command card release sync (temporary)
on:
  push:
    branches:
      - feature/atlas-home-lab-command-card-20261016
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check copy actions and generate deterministic Atlas release
        run: |
          node tools/check-rta-lab-commands.js
          node tools/build-rta-atlas-cache.js
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
      - name: Commit only generated Atlas files back to current feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(atlas): synchronize command card release and offline assets'
            git push origin HEAD:refs/heads/feature/atlas-home-lab-command-card-20261016
          fi
