name: RTA NiFe 7-6 temporary deterministic regenerate
on:
  push:
    branches:
      - feature/nife30-seven-nife52-six-global-20261029
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nife30-seven-nife52-six-global-20261029
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate preview, release, receipts and offline caches
        run: |
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview --check
      - name: Record deterministic generated files on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas
          if ! git diff --cached --quiet; then
            git commit -m "Generate Atlas preview/release and isolated offline cache for NiFe30/7"
            git push origin HEAD:feature/nife30-seven-nife52-six-global-20261029
          fi
      - name: Focused regression checks
        run: |
          node tools/check-rta-sensory-core.js
          node tools/check-rta-nife30-watt.js
          node tools/check-rta-atlas-modules.js
          node tools/check-rta-decision-flows.js
          node tools/check-rta-415cool.js
          node tools/check-rta-lab-mobile-clarity.js
