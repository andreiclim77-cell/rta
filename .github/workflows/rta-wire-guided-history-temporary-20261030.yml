name: RTA Wire guided deterministic regen (temporary)
on:
  push:
    branches:
      - fix/wire-single-flow-preserve-history-20261030
    paths:
      - .github/workflows/rta-wire-guided-history-temporary-20261030.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-single-flow-preserve-history-20261030
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Atlas release and isolated caches
        run: |
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview --check
      - name: Wire flow and protected legacy regression
        run: |
          node tools/check-rta-decision-flows.js
          node tools/check-rta-atlas-modules.js
          node tools/check-rta-atlas-preview.js
          node tools/check-rta-sensory-core.js
          node tools/check-rta-nife30-watt.js
      - name: Commit generated release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Atlas UI release and caches for single Wire flow'
            git push origin HEAD:fix/wire-single-flow-preserve-history-20261030
          fi
