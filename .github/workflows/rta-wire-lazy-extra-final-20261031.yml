name: RTA Wire lazy analytics deterministic rebuild
on:
  push:
    branches:
      - fix/rta-wire-journey-clarity-20261031
    paths:
      - .github/workflows/rta-wire-lazy-extra-final-20261031.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rta-wire-journey-clarity-20261031
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate preview release and offline cache
        run: |
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview --check
      - name: Functional QA
        run: |
          node tools/check-rta-decision-flows.js
          node tools/check-rta-atlas-modules.js
          node tools/check-rta-sensory-core.js
          node tools/check-rta-nife30-watt.js
      - name: Save generated release to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Atlas after lazy optional-analytics patch'
            git push origin HEAD:fix/rta-wire-journey-clarity-20261031
          fi
