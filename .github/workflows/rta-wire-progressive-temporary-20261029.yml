name: RTA Wire Progressive temporary build and regression
on:
  push:
    branches:
      - feature/rta-wire-catalog-adaptive-match-20261029
    paths:
      - .github/workflows/rta-wire-progressive-temporary-20261029.yml
permissions:
  contents: write
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rta-wire-catalog-adaptive-match-20261029
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate isolated Atlas preview and release
        run: |
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview --check
      - name: All relevant RTA functional regressions
        run: |
          node tools/check-rta-atlas-modules.js
          node tools/check-rta-decision-flows.js
          node tools/check-rta-sensory-core.js
          node tools/check-rta-nife30-watt.js
          node tools/check-rta-atlas-preview.js
      - name: Commit deterministic generated release assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Atlas release and isolated caches for progressive Wire Lab'
            git push origin HEAD:feature/rta-wire-catalog-adaptive-match-20261029
          fi
