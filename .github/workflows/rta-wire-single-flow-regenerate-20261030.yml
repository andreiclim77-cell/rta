name: RTA Wire single-flow deterministic regeneration
on:
  push:
    branches:
      - fix/wire-single-flow-preserve-history-20261030
    paths:
      - .github/workflows/rta-wire-single-flow-regenerate-20261030.yml
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-single-flow-preserve-history-20261030
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate preview and release with isolated caches
        run: |
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview --check
      - name: Validate functional contract and six-wire journey
        run: |
          node tools/check-rta-sensory-core.js
          node tools/check-rta-nife30-watt.js
          node tools/check-rta-atlas-modules.js
          node tools/check-rta-decision-flows.js
          node tools/check-rta-atlas-preview.js
      - name: Publish generated artifacts to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Atlas release/cache after restoring deferred Wire context'
            git push origin HEAD:fix/wire-single-flow-preserve-history-20261030
          fi
