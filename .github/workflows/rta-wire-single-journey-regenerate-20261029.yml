name: RTA Wire single journey deterministic release
on:
  push:
    branches:
      - fix/rta-wire-single-journey-20261029
    paths:
      - .github/workflows/rta-wire-single-journey-regenerate-20261029.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rta-wire-single-journey-20261029
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build preview, release, receipt, offline caches
        run: |
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview
          node tools/build-rta-atlas-release.js
          node tools/build-rta-atlas-release.js --check
          node tools/build-rta-atlas-cache.js rta-lab/atlas-preview --check
      - name: Focused functional and canonical data regression
        run: |
          node tools/check-rta-decision-flows.js
          node tools/check-rta-atlas-modules.js
          node tools/check-rta-sensory-core.js
          node tools/check-rta-nife30-watt.js
          node tools/check-rta-atlas-preview.js
          node tools/check-rta-415cool.js
      - name: Commit deterministic generated assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rta-lab/atlas-preview/sw.js rta-lab/atlas
          if ! git diff --cached --quiet; then
            git commit -m 'Generate single-journey Atlas release with complete wire preferences'
            git push origin HEAD:fix/rta-wire-single-journey-20261029
          fi
