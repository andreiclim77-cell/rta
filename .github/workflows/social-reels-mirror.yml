name: Facebook and Instagram Reels mirror

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify connections or publish one Reel pair
        required: true
        default: verify
        type: choice
        options:
          - verify
          - mirror
  workflow_run:
    workflows:
      - Instagram mirror from Facebook
    types:
      - completed
  schedule:
    # Four source posts/day at most; each source creates one Facebook and one Instagram Reel.
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: facebook-instagram-reels-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (vars.INSTAGRAM_AUTOPUBLISH_ENABLED == 'true' &&
       (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install media dependencies
        run: |
          npm ci
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Validate Reel automation
        run: |
          node --check tools/social-reels-publisher.js
          node tools/check-social-reels-publisher.js
          node tools/social-reels-publisher.js --check --max-posts 1 --daily-limit 4

      - name: Verify Facebook Page and Instagram professional account
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/social-reels-publisher.js --verify-connection

      - name: Prepare one vertical Reel
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mirror'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/social-reels-publisher.js --prepare --max-posts 1 --daily-limit 4

      - name: Commit prepared public Reel
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mirror'
        shell: bash
        run: |
          if git diff --quiet -- data/social-reels-state.json assets/social-reels; then
            echo "No Reel preparation change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-reels-state.json assets/social-reels
          git commit -m "Prepare Facebook and Instagram Reel"
          git pull --rebase
          git push

      - name: Publish Reel pair and verify platform receipts
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mirror'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v25.0' }}
        run: node tools/social-reels-publisher.js --publish-prepared --max-posts 1 --daily-limit 4

      - name: Commit Reel publication receipts
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'mirror'
        shell: bash
        run: |
          if git diff --quiet -- data/social-reels-state.json; then
            echo "No Reel receipt change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-reels-state.json
          git commit -m "Record Facebook and Instagram Reels"
          git pull --rebase
          git push
