<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07090d">
  <title>Actualizare RTA Build Lab</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090d;color:#edf2f6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(520px,100%);padding:24px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:#10151c;box-shadow:0 20px 50px rgba(0,0,0,.35)}h1{margin:0 0 10px;font-size:24px}p{margin:8px 0;color:#b9c4ce;line-height:1.55}.ok{color:#aee6c2;font-weight:800}.err{color:#ffc0ad;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <h1>Actualizare RTA Build Lab</h1>
    <p id="status">Șterg versiunea veche și încarc motorul V7…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(registration => registration.scope.includes('/rta-lab/'))
            .map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter(key => key.startsWith('rta-lab-'))
            .map(key => caches.delete(key)));
        }
        status.className = 'ok';
        status.textContent = 'Cache curățat. Se deschide versiunea nouă…';
        setTimeout(() => location.replace('./?v=7&reset=' + Date.now()), 350);
      } catch (error) {
        status.className = 'err';
        status.textContent = 'Nu am putut curăța automat cache-ul. Închide această pagină, șterge datele site-ului ghid-rta.ro și redeschide Lab-ul.';
      }
    })();
  </script>
</body>
</html>
